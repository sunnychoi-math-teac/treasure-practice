<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--ink);background:#FBF7F3;font-size:17px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--choco);color:#FFF4E6;padding:8px max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:'Nunito',sans-serif;font-style:italic;font-weight:900;font-size:21px;white-space:nowrap}
.who{font-size:13px;opacity:.85;white-space:nowrap}

.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chip{height:28px;border-radius:14px;border:1.5px solid rgba(255,244,230,.5);background:transparent;color:#FFF4E6;font-size:12.5px;padding:0 9px;cursor:pointer}
.chip.done{background:#FFF4E6;color:var(--choco);border-color:#FFF4E6}
.chip.here{outline:2px solid var(--yel);outline-offset:1px;font-weight:700}
.chip[disabled]{opacity:.45;cursor:default}
.part{background:var(--yel);color:var(--ink);font-size:13px;font-weight:700;border-radius:999px;padding:2px 12px;white-space:nowrap}
.ws.solo.wide .pane{max-width:1200px}
.maps{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:start}
.mapcol h3{margin:4px 0;font-size:18px}.mapcol p{font-size:15px}
.mapbox{border-radius:12px;overflow:hidden}.mapbox .board{height:auto}
.tencol{align-self:center}.ten{min-height:60px;font-size:18px}
@media (orientation:portrait){.maps{grid-template-columns:1fr}.tencol{justify-self:center}}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.figs .opt{margin:0}.figs .opt svg{width:100%;height:auto;max-width:220px}
.mth{font-family:KaTeX_Main,'Times New Roman',serif;font-size:19px}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 2px}.fr>span+span{border-top:1.5px solid currentColor}

.ro-band{background:var(--coral);color:#fff;text-align:center;font-size:14px;padding:4px}

.ws-dock{flex:none}

.stage{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#F6F1EC}
.board{width:100%;height:100%;max-height:100%;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(26,31,77,.12);touch-action:none;user-select:none;-webkit-user-select:none}

<script>
(async function () {
  'use strict';
  const SLUG = 'choco-diagram', TITLE = '초코볼 다이어그램';
  const UPLOAD_URL = 'https://jerhkttkwvkfhiusgjhv.supabase.co/functions/v1/land-upload';
  const UPLOAD_KEY = 'sb_publishable_MVAoOq79TXkJWwCXuPBSPQ_DvZpeCPR';
  // 화면 순서와 위쪽 칩 이름
  const FLOW = ['T', 'S1', 'S2', 'S5', 'Q', 'MAP', 'S8', 'S10', 'S11', 'END'];
  const NAME = { T: '실험 관찰', S1: '사진', S2: '세 점', S5: '수직이등분선', Q: '깜짝퀴즈', MAP: '지도', S8: '도전', S10: '학습 확인', S11: '소감', END: '제출' };
  const PART = { T: '파트1', S1: '파트1', S2: '파트1', S5: '파트1', Q: '깜짝퀴즈', MAP: '파트2', S8: '파트2', S10: '마무리', S11: '마무리', END: '마무리' };
  const OLD = { S3: 'T', S4: 'T', S6: 'S5', S71: 'MAP', S72: 'MAP', S73: 'MAP', S9: 'S8' };   // 예전 화면 이름(v1.0 첫판)
  const U = ['전혀 모르겠어요', '조금 알겠어요', '그럭저럭 이해했어요', '잘 이해했어요', '완벽히 이해했어요'];
  const F = ['별로였어요', '조금 아쉬웠어요', '보통이었어요', '재밌었어요', '최고였어요'];
  const UF = ['😵', '🤔', '🙂', '😊', '🤩'];
  const VIEW1 = { x0: -30, x1: 30, y0: -20, y1: 20 };            // 초코볼 좌표평면(데스모스와 같음)
  const VIEW4 = { x0: -15, x1: 15, y0: -20, y1: 20 };            // 선생님 실험 사진
  const MAPW = 1093 / 67.76, MAPH = 859 / 67.76;                 // 지도 크기(칸)
  // 선생님 실험 사진(1932×2576)의 초코볼 7개 → 사진을 가로 30, 세로 40 으로 가운데 둔 좌표
  const TEACHER = [[392, 1140], [680, 1640], [1100, 1128], [1048, 480], [1540, 700], [1632, 1552], [980, 2020]]
    .map(([x, y]) => [+((x / 1932 - .5) * 30).toFixed(2), +((.5 - y / 2576) * 40).toFixed(2)]);

  const $ = s => document.querySelector(s);
  const esc = Land.esc;
  function h(tag, attrs, kids) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) { const v = attrs[k]; if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v); }
    [].concat(kids == null ? [] : kids).forEach(c => c != null && e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return e;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function S(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function toast(m) { const t = h('div', { class: 'toastx', text: m, role: 'status' }); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  const fmt = v => (Math.round(v * 100) / 100).toString().replace('-', '−');
  const pt = p => `(${fmt(p[0])}, ${fmt(p[1])})`;

  /* ---------- 진행 상태 (land_records.detail) ---------- */
  function newP(no) {
    const c = () => ({ input: '', ok: false, wrong: 0 });
    return { v: 2, ver: 1 + (Number(no) % 5), screen: 'T', done: [], photo: null, abc: { A: [-10, 0], B: [0, 0], C: [10, 0] }, nb: null, s3: '', s4: [],
      s5: { AB: { mid: c(), slope: c(), eq: c() }, BC: { mid: c(), slope: c(), eq: c() } }, files: {}, quiz: [0, 1, 2, 3].map(() => ({ first: null, tries: 0, ok: false })),
      s71: { xs: [], why: '' }, s72: { picked: [], why: '', open: false }, s8: { A: c(), B: c() },
      s10: { q1: { first: null, tries: 0, ok: false }, q2: { first: null, tries: 0, ok: false }, eq: c() }, s11: { u: 3, c: 3, text: '', apply: '' }, submitted: '' };
  }
  function merge(a, b) { if (!b || typeof b !== 'object' || Array.isArray(b)) return b === undefined ? a : b; const o = Object.assign({}, a); for (const k in b) o[k] = (a && typeof a[k] === 'object' && a[k] && !Array.isArray(a[k])) ? merge(a[k], b[k]) : b[k]; return o; }

  let enter = await Land.start({ slug: SLUG, title: TITLE });
  const RO = enter.readOnly;
  let P = merge(newP(enter.student.no), (enter.record && enter.record.detail) || {});
  const V = Geo.VERSIONS[P.ver - 1];
  const saver = Land.saver(enter, { title: TITLE });
  const save = () => { if (!RO) saver.save(P); };
  $('#who').innerHTML = `${esc(enter.student.no)} ${esc(enter.student.name)} <button type="button" id="out">로그아웃</button>`;
  $('#out').onclick = () => Land.logout();
  if (RO) $('#ro').hidden = false;
  const setTopH = () => document.documentElement.style.setProperty('--topH', ($('#top').offsetHeight + ($('#ro').hidden ? 0 : $('#ro').offsetHeight)) + 'px');
  window.addEventListener('resize', setTopH); setTopH();
  const ML = MathPad.ready();

  /* ---------- 사진 올리기 (land-upload: m1 초코볼, m2 풀이①, m3 풀이②) ---------- */
  function shrink(file, max) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); res({ url: c.toDataURL('image/jpeg', .85), w: c.width, h: c.height }); }; im.onerror = () => rej(new Error('그림을 읽지 못했어요')); im.src = fr.result; };
      fr.onerror = () => rej(new Error('파일을 읽지 못했어요')); fr.readAsDataURL(file);
    });
  }
  async function post(body) {
    const res = await fetch(UPLOAD_URL, { method: 'POST', headers: { 'content-type': 'application/json', apikey: UPLOAD_KEY }, body: JSON.stringify(Object.assign({ token: enter.token, run_id: enter.run.id }, body)) });
    let r = null; try { r = await res.json(); } catch (e) { }
    if (!r) throw new Error('서버 응답 없음'); if (!r.ok) throw new Error(r.code || '올리기 실패'); return r;
  }
  async function upload(key, dataUrl) {
    let err;
    for (let k = 0; k < 3; k++) { try { return await post({ key, data: dataUrl }); } catch (e) { err = e; if (/closed|ended|not_target|bad_|too_big|no_session/.test(e.message)) throw e; await new Promise(r => setTimeout(r, 1500 * (k + 1))); } }
    throw err;
  }
  const upErr = e => /closed|ended/.test(e.message) ? '마감되어 올릴 수 없어요.' : '올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  let myUrls = null;
  async function myUrl(key) { try { if (!myUrls) myUrls = (await post({ action: 'list' })).urls || {}; } catch (e) { myUrls = {}; } return myUrls[key] || null; }
  const local = {};   // 이번에 고른 사진(dataURL)
  async function photoSrc(key) { return local[key] || (P.files[key] ? await myUrl(key) : null); }

  /* ---------- 좌표평면 그림판 ---------- */
  const MATHFONT = "KaTeX_Main,'Times New Roman',Times,serif";
  function Board(host, v, opt = {}) {
    const K = 20, W = (v.x1 - v.x0) * K, H = (v.y1 - v.y0) * K;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, class: 'board', role: 'img', 'aria-label': opt.label || '좌표평면' });
    host.innerHTML = ''; host.appendChild(svg);
    const X = x => (x - v.x0) * K, Y = y => (v.y1 - y) * K;
    const world = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x / K + v.x0, v.y1 - q.y / K]; };
    const g = () => S('g', {}, svg);
    return { svg, K, X, Y, world, g, v, W, H, s: W / 760 };   // s: 화면에서 글자 크기를 비슷하게 맞추는 배율
  }
  // 수식 글꼴 글자: 영문자는 기울임, 숫자·기호는 바로. 흰 테두리로 선과 겹쳐도 읽히게
  function mtext(parent, x, y, str, o = {}) {
    const t = S('text', Object.assign({ x, y, 'font-family': MATHFONT, 'font-size': o.size || 15, fill: o.fill || '#1A1F4D', stroke: '#fff', 'stroke-width': o.halo ?? 4, 'paint-order': 'stroke', 'text-anchor': o.anchor || 'start', 'font-weight': o.bold ? 700 : 400 }), parent);
    String(str).replace(/-/g, '−').split(/([A-Za-z])/).forEach(part => { if (!part) return; const s = S('tspan', /[A-Za-z]/.test(part) ? { 'font-style': 'italic' } : {}, t); s.textContent = part; });
    return t;
  }
  // 좌표축: 원점 O, x, y, 눈금 숫자(every 칸마다). grid 를 주면 옅은 격자
  function axes(b, every, o = {}) {
    const g = S('g', { 'pointer-events': 'none' }, o.parent || b.svg), v = b.v, ink = '#1A1F4D', k = b.s;
    if (o.grid) {
      for (let x = Math.ceil(v.x0 / o.grid) * o.grid; x <= v.x1; x += o.grid) S('line', { x1: b.X(x), y1: 0, x2: b.X(x), y2: b.H, stroke: ink, 'stroke-opacity': .08, 'stroke-width': k }, g);
      for (let y = Math.ceil(v.y0 / o.grid) * o.grid; y <= v.y1; y += o.grid) S('line', { x1: 0, y1: b.Y(y), x2: b.W, y2: b.Y(y), stroke: ink, 'stroke-opacity': .08, 'stroke-width': k }, g);
    }
    const ox = b.X(0), oy = b.Y(0), inX = v.x0 <= 0 && v.x1 >= 0, inY = v.y0 <= 0 && v.y1 >= 0;
    const lw = 2 * k, a = 11 * k, hw = 5 * k, fs = 15 * k, left = ox < 30 * k;   // y축이 왼쪽 끝에 붙으면 눈금 숫자를 오른쪽에
    if (inY) { S('line', { x1: 0, y1: oy, x2: b.W - 2 * k, y2: oy, stroke: ink, 'stroke-width': lw }, g); S('path', { d: `M${b.W - 2 * k} ${oy}l${-a} ${-hw}v${2 * hw}z`, fill: ink }, g); mtext(g, b.W - 16 * k, oy - 10 * k, 'x', { size: 19 * k, halo: 4 * k }); }
    if (inX) { S('line', { x1: ox, y1: b.H, x2: ox, y2: 2 * k, stroke: ink, 'stroke-width': lw }, g); S('path', { d: `M${ox} ${2 * k}l${-hw} ${a}h${2 * hw}z`, fill: ink }, g); mtext(g, ox + 10 * k, 18 * k, 'y', { size: 19 * k, halo: 4 * k }); }

    gate = () => !P.s71.xs.length ? '2014년 지도에 학교를 표시해 주세요.' : !P.s71.why.trim() ? '2014년 지도에 표시한 이유를 써 주세요.' : !P.s72.open ? '[10년 뒤 →]를 눌러 2024년 지도를 보세요.' : P.s72.picked.length < 2 ? '사라졌을 것 같은 2곳을 골라 주세요.' : !P.s72.why.trim() ? '2024년 지도에서 그렇게 생각한 이유를 써 주세요.' : '';
  };

  /* ---------- ⑥ 도전 문제 + 풀이 사진 ② ---------- */
  const eqText = l => { const s = -l[1], m = l[0] / s, c = l[2] / s; return `y = ${m === 1 ? '' : fmt(m)}x${c ? (c > 0 ? ' + ' : ' − ') + fmt(Math.abs(c)) : ''}`; };
  RENDER.S8 = async () => {
    const pane = frame(); await ML;
    pane.append(h('h2', { text: '⑥ 사라진 옛 학교를 찾아라!' }),
      h('p', { html: `지도에 나타난 두 점 <b>P${pt(V.P)}, Q${pt(V.Q)}</b>의 좌표와<br>보로노이 다이어그램 경계선의 방정식 <b>${eqText(V.lineA)}</b>, <b>${eqText(V.lineB)}</b>를 이용하여` }),
      h('p', { html: '사라진 두 학교 <b>A(a, b), B(c, d)</b>의 좌표를 구해 보자. <b>학습지에 직접 풀어</b> 보세요.' }));
    const b = mapBoard($('#stage'), 'img/map-base.png', '사라진 옛 학교 찾기 지도', true), eight = [...Geo.others(P.ver), V.P, V.Q, V.A, V.B];
    const eg = b.g(), rg = b.g(), sg = b.g(), ans = b.g(), lab = b.g();
    S('defs', {}, b.svg).innerHTML = '<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D23B2E"/></marker>';
    const vo = Geo.voronoi(eight, b.v);
    vo.edges.forEach(e => { const red = (e.a === 4 && e.b === 6) || (e.a === 5 && e.b === 7); seg(b, e.p, e.q, red ? { stroke: '#D23B2E', 'stroke-width': 5 * b.s } : { stroke: '#2F55D4', 'stroke-width': 2.5 * b.s, 'stroke-opacity': .85 }, red ? rg : eg); });
    // 식 이름표: 빨간 선분의 가운데에서 학교 반대쪽으로 비켜 놓고 화살표로 가리킴
    [[4, 6, V.lineA], [5, 7, V.lineB]].forEach(([a, c, l]) => {
      const e = vo.edges.find(x => x.a === a && x.b === c); if (!e) return;
      const m = [(e.p[0] + e.q[0]) / 2, (e.p[1] + e.q[1]) / 2], dx = e.q[0] - e.p[0], dy = e.q[1] - e.p[1], n = Math.hypot(dx, dy);
      // 이름표 자리: 학교 P(Q)의 반대쪽에서, 다른 학교들과 가장 멀리 떨어진 곳
      const tx = dx / n, ty = dy / n; let nx = -ty, ny = tx; const s0 = eight[a]; if ((s0[0] - m[0]) * nx + (s0[1] - m[1]) * ny > 0) { nx = -nx; ny = -ny; }
      let best = null;
      for (const u of [-.6, 0, .6].map(f => f * n / 2)) for (const t of [1.2, 1.7, 2.3]) {
        const tg = [m[0] + tx * u, m[1] + ty * u], q = [tg[0] + nx * t, tg[1] + ny * t];
        if (q[0] < b.v.x0 + 1.6 || q[0] > b.v.x1 - 1.6 || q[1] < b.v.y0 + .5 || q[1] > b.v.y1 - .5) continue;
        const sc = Math.min(...eight.map(p => Math.hypot((p[0] - q[0]) / 2.2, p[1] - q[1] - .15)));   // 글자가 옆으로 길어서 가로 거리는 줄여 셈
        if (!best || sc > best.sc) best = { sc, q, tg };
      }
      const L = best.q, T = best.tg;
      S('line', { x1: b.X(L[0]), y1: b.Y(L[1]), x2: b.X(T[0] + nx * .25), y2: b.Y(T[1] + ny * .25), stroke: '#D23B2E', 'stroke-width': 2 * b.s, 'marker-end': 'url(#arw)' }, lab);
      mtext(lab, b.X(L[0]), b.Y(L[1]) + (ny > 0 ? -6 : 18) * b.s, eqText(l).replace(/−/g, '-'), { fill: '#D23B2E', size: 19 * b.s, halo: 5 * b.s, bold: true, anchor: 'middle' });
    });
    Geo.others(P.ver).forEach(p => school(b, p, '#2F55D4', sg));
    school(b, V.P, '#D23B2E', sg, `P${pt(V.P)}`.replace(/−/g, '-'), undefined, true); school(b, V.Q, '#D23B2E', sg, `Q${pt(V.Q)}`.replace(/−/g, '-'), undefined, true);   // 빨간 경계선이 오른쪽에 있어 이름은 왼쪽에
    const fields = {}, marks = {};
    const showAns = () => { ans.innerHTML = ''; ['A', 'B'].forEach(k => { const s = P.s8[k]; if (!s.input) return; try { const p = TMath.parsePoint(TMath.latexToPlain(s.input)); school(b, p, s.ok ? '#1E8E5A' : '#9AA0BF', ans, k); } catch (e) { } }); };
    ['A', 'B'].forEach(k => {
      const st = P.s8[k]; fields[k] = MathPad.mathInput(st.input, () => btn.click()); marks[k] = h('div', { class: 'mark' + (st.ok ? ' ok' : ''), text: st.ok ? '✓' : '' });
      pane.append(h('div', { class: 'kv' + (st.ok ? ' ok' : '') }, [h('span', { class: 'k', text: `사라진 학교 ${k}의 좌표 (예: (2, 3))` }), fields[k], marks[k]]));
    });
    const btn = h('button', { class: 'btn yel', type: 'button', text: '학교의 위치 확인하기', disabled: RO, style: 'margin-top:8px' }), fb = fbBox();
    pane.append(btn, fb);
    btn.onclick = () => {
      let all = true;
      ['A', 'B'].forEach(k => {
        const st = P.s8[k], tex = fields[k].tex(); if (!tex.trim()) { all = false; return; }
        let p; try { p = TMath.parsePoint(fields[k].plain()); } catch (e) { marks[k].className = 'mark no'; marks[k].textContent = '(x좌표, y좌표) 꼴로 써 주세요.'; all = false; return; }
        const ok = near(p[0], V[k][0]) && near(p[1], V[k][1]); if (!ok) st.wrong++;
        st.input = tex; st.ok = ok; all = all && ok;
        marks[k].className = 'mark ' + (ok ? 'ok' : 'no'); marks[k].textContent = ok ? '✓' : '아직 아니에요';
      });
      showAns(); save();
      say(fb, all ? 'ok' : '', all ? '✓ 사라진 두 학교를 찾았어요! 경계선이 빨간 선과 딱 맞지요?' : '');
    };
    showAns();
    pane.append(solBlock('m3', '풀이 사진 ② 올리기', '학습지의 사라진 학교 좌표 구하기 풀이를 찍어 올려 주세요.'));
  };

  /* ---------- 마무리: 오늘의 학습 확인 (그래프) ---------- */
  // '−4/3' 같은 글을 위아래 분수로
  const frac = t => esc(t).replace(/(\d+)\/(\d+)/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
  RENDER.S10 = async () => {
    const pane = frame(); await ML;
    pane.append(h('h2', { text: '오늘의 학습 확인' }), h('p', { text: '오른쪽 두 점 A(2, 4), B(−3, −1)의 수직이등분선의 방정식을 y = f(x) 꼴로 구해 봐요.' }));
    const b = Board($('#stage'), { x0: -6, x1: 6, y0: -4, y1: 7 }, { label: '두 점 A(2, 4), B(-3, -1)' }); axes(b, 1, { grid: 1 });
    seg(b, [2, 4], [-3, -1], { stroke: '#1E8E5A', 'stroke-width': 4 * b.s });
    [[[2, 4], 'A(2, 4)', 10, -10], [[-3, -1], 'B(-3, -1)', 10, 22]].forEach(([p, t, dx, dy]) => { S('circle', { cx: b.X(p[0]), cy: b.Y(p[1]), r: 7 * b.s, fill: '#2F6FDB', stroke: '#fff', 'stroke-width': 3 * b.s }, b.svg); mtext(b.svg, b.X(p[0]) + dx * b.s, b.Y(p[1]) + dy * b.s, t, { size: 19 * b.s, halo: 4 * b.s, fill: '#2F6FDB', bold: true }); });
    const MC = [['q1', '1. 수직이등분선의 기울기는?', ['−4/3', '−1', '1', '4/3'], 1], ['q2', '2. 수직이등분선이 반드시 지나는 점은?', ['A(2, 4)', 'B(−3, −1)', '(−1/2, 3/2)', '(−1, 3)'], 2]];
    MC.forEach(([key, q, opts, a]) => {
      const st = P.s10[key], box = h('div', { class: 'box' }, [h('p', { html: `<b>${q}</b>` })]), fb = fbBox();
      const bs = opts.map((o, j) => { const bt = h('button', { class: 'opt' + (st.ok && j === a ? ' ok' : ''), type: 'button', disabled: RO }, [h('b', { text: '①②③④'[j] }), h('span', { class: 'mth', html: frac(o) })]); bt.onclick = () => { if (st.first === null) st.first = j; st.tries++; st.ok = j === a; bs.forEach(x => x.className = 'opt'); bt.className = 'opt ' + (st.ok ? 'ok' : 'no'); say(fb, st.ok ? 'ok' : 'no', st.ok ? '✓' : '아직 아니에요'); save(); }; return bt; });
      box.append(...bs, fb); pane.append(box);
    });
    const st = P.s10.eq, w = MathPad.mathInput(st.input, () => chk()), mk = h('div', { class: 'mark' + (st.ok ? ' ok' : ''), text: st.ok ? '✓' : '' });
    const chk = () => { if (RO || !w.tex().trim()) return; const l = readLine(w); if (l === 'form') { mk.className = 'mark no'; mk.textContent = '직선의 방정식(○ = ○ 꼴)으로 써 주세요.'; return; } st.input = w.tex(); st.ok = Geo.sameLine(l, [1, 1, -1]); if (!st.ok) st.wrong++; mk.className = 'mark ' + (st.ok ? 'ok' : 'no'); mk.textContent = st.ok ? '✓' : '아직 아니에요'; save(); };
    pane.append(h('div', { class: 'box' }, [h('p', { html: '<b>3. 선분 AB의 수직이등분선의 방정식</b>' }), h('div', { class: 'row' }, [w, h('button', { class: 'btn small', type: 'button', text: '확인', onclick: chk, disabled: RO })]), mk]));
  };

  /* ---------- 소감 · 제출 ---------- */
  RENDER.S11 = () => {
    const pane = frame(true);
    const mk = (key, q, words) => {
      const face = h('div', { class: 'big', text: UF[P.s11[key] - 1] }), word = h('p', { style: 'text-align:center;font-weight:700', text: words[P.s11[key] - 1] });
      const r = h('input', { type: 'range', min: 1, max: 5, step: 1, 'aria-label': q, disabled: RO }); r.value = P.s11[key];
      r.oninput = () => { P.s11[key] = +r.value; face.textContent = UF[r.value - 1]; word.textContent = words[r.value - 1]; save(); };
      return h('div', { class: 'box' }, [h('p', { html: `<b>${q}</b>` }), face, r, word]);
    };
    const ta = h('textarea', { 'aria-label': '한 줄 소감', placeholder: '(선택) 오늘 수업에서 새롭게 알게 된 점이나 느낀 점', disabled: RO }); ta.value = P.s11.text; ta.oninput = () => { P.s11.text = ta.value; save(); };
    const ap = h('textarea', { 'aria-label': '보로노이 다이어그램을 적용해 보고 싶은 실생활·진로 분야', placeholder: '예) 어떤 분야에서, 무엇을 나누거나 찾는 데 쓸 수 있을까요?', disabled: RO }); ap.value = P.s11.apply || ''; ap.oninput = () => { P.s11.apply = ap.value; save(); };
    const sub = h('button', { class: 'btn yel', type: 'button', text: '제출하기', disabled: RO }), fb = fbBox();
    pane.append(h('h2', { text: '오늘 잘했나요?' }),
      h('div', { class: 'box' }, [h('p', { html: '오늘의 학습 목표<br>· 보로노이 다이어그램 속에서 두 직선의 수직 조건을 탐구하고 이해한다.<br>· 두 직선의 수직 조건을 이용하여 지도 위의 위치를 찾는 실생활 문제를 해결한다.' })]),
      mk('u', '오늘 수학 시간에 얼마나 잘 이해했나요?', U), mk('c', '오늘 수업은 어땠나요?', F),
      h('div', { class: 'box' }, [h('p', { html: '<b>보로노이 다이어그램의 원리를 적용해 보고 싶은 실생활 분야나, 나의 진로 분야와 함께할(콜라보) 수 있는 부분이 있나요?</b>' }), ap]),
      h('label', { class: 'sl', text: '한 줄 소감' }), ta, sub, fb);
    sub.onclick = async () => {
      sub.disabled = true; say(fb, 'info', '제출하는 중…');
      P.submitted = new Date().toISOString(); if (!P.done.includes('S11')) P.done.push('S11');
      const r = await saver.finish(P, { summary: (P.s11.text || '').trim() || (P.s3 || '').trim().slice(0, 200) || null });
      if (r && r.ok) go('END'); else { sub.disabled = false; say(fb, 'no', '제출하지 못했어요. 다시 눌러 주세요.'); }
    };
  };
  RENDER.END = () => {
    const pane = frame(true);
    pane.append(h('div', { class: 'big', text: '🍫' }), h('h2', { style: 'text-align:center', text: '제출했어요! 수고했어요.' }),
      h('p', { style: 'text-align:center', text: '학습지는 선생님께 내 주세요. 위쪽 칩을 눌러 지난 화면을 다시 볼 수 있어요.' }),
      h('div', { class: 'foot', html: Land.footerHtml(TITLE) + '<p class="note" style="text-align:center">수식 입력: MathLive (MIT License)</p>' }));
  };

  chips(); render();
})();
</script>
