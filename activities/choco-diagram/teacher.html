<style>
main{max-width:1400px}
.top-in{max-width:1400px}
.classbar,.tabs,.mbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cchip,.tab,.mchip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.cchip small,.mchip small{font-weight:400;color:var(--ink3);margin-left:2px}
.cchip.closed{border-color:var(--coral)}
.cchip.on,.tab.on,.mchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cchip.on small,.mchip.on small{color:#D5D9F0}
.tabs{margin-top:8px}
.lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.lock span{color:var(--ink2);font-size:13px;flex:1;min-width:220px}
.lock.on{background:#FCE4E0;border-color:#F2B8AE}.lock.on b{color:#A0362A}
.msg{padding:9px 14px;border-radius:12px;margin:0 0 12px;font-size:14px}
.msg.ok{background:#DFF7EC;color:#1D6B45}.msg.no{background:#FCE4E0;color:#A0362A}
.note{color:var(--ink3);font-size:13px;line-height:1.6;margin:0 0 10px}
.sumwrap{margin:0 0 16px}
tr.pick{cursor:pointer}
#tbl td,#tbl th{text-align:center;white-space:nowrap;padding:7px 8px}
#tbl td.l,#tbl th.l{text-align:left}
.ok{color:var(--green);font-weight:700}.no{color:var(--red)}.dim{color:#B5B9CF}
.esc{display:inline-block;border-radius:12px;padding:1px 9px;font-weight:700;background:#DFF7EC;color:#1D6B45}
.detail{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:14px}
.detail h2{margin:0 0 6px;font-size:19px}
.detail dl{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:6px 14px;margin:8px 0 14px}
.detail dt{font-weight:700}.detail dd{margin:0;word-break:break-all}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.gcard .ph{aspect-ratio:3/4;border-radius:10px;background:var(--sheet);display:grid;place-items:center;color:var(--ink3);overflow:hidden;font-size:13px;text-align:center;padding:4px}
.gcard img{width:100%;height:100%;object-fit:contain;display:block}
.gcard.none{cursor:default;opacity:.75}
.gcard .nm{font-weight:700}.gcard .ty{font-size:13px;color:var(--ink2)}
.ov{position:fixed;inset:0;background:rgba(14,18,32,.88);display:grid;place-items:center;z-index:50;padding:16px;cursor:zoom-out}
.ov img{max-width:100%;max-height:84vh;border-radius:12px;background:#fff;display:block;margin:0 auto}
.ov .cap{color:#fff;font-weight:700;font-size:18px;text-align:center;margin-top:10px}
/* 지금 어디에 */
.where{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.wrow .wn{font-weight:700}.wrow .wn small{display:block;font-weight:400;color:var(--ink3)}
.wrow .ppl{display:flex;flex-wrap:wrap;gap:6px}
.pp{border-radius:999px;padding:3px 10px;background:var(--sheet);font-size:13px}
.pp.stuck{background:#FCE4E0;color:#A0362A;font-weight:700}
.pp.doneP{background:#DFF7EC;color:#1D6B45}
.wbar{height:8px;border-radius:6px;background:var(--sheet);overflow:hidden;margin-top:6px}.wbar i{display:block;height:100%;background:#c9a227}
/* 흔한 오답 */
.wrongs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wbox h3{margin:0 0 4px;font-size:16px}.wbox .sub{font-size:13px;color:var(--ink3);margin:0 0 8px}
.wl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.wl code{background:var(--sheet);border-radius:6px;padding:1px 6px;word-break:break-all;font-family:inherit}
/* 소감 */
.evtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.evbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.evbox b{display:block;margin-bottom:6px}
.evrow{display:grid;grid-template-columns:26px 130px 1fr 44px;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.evf{font-size:18px}.evbar{background:var(--sheet);border-radius:6px;height:12px;overflow:hidden}.evbar i{display:block;height:100%;background:var(--mint);border-radius:6px}.evn{text-align:right;color:var(--ink2)}
.evtools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.evtools label{display:flex;align-items:center;gap:6px;cursor:pointer}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.evcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.evcard.empty{opacity:.65}
.evhd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink2)}.evhd b{font-size:16px;color:var(--ink);margin-right:auto}
.evtx{white-space:pre-wrap;line-height:1.65;font-size:15px}
/* 방탈출 현황판 고유 색: 밤하늘 남색 머리띠 + 금색 줄 */
:root{--night:#141a30;--gold:#c9a227;--paper:#FFFDF9;--edge:#EADFC8;--line:#ECE3CF;--sheet:#F6F1E4}
body{background:#F4F1EA}
.top{background:var(--night);border-bottom:0;box-shadow:0 3px 0 var(--gold)}
.top .brand,.top .who{color:#F5F2E6}
.top .nav a{color:#D9DEF5}
.top .btn{background:transparent;color:#F5F2E6;border-color:#4A5596}
.card,.stat,.scroll,.detail,.gcard,.evbox,.evcard,.lock,.wrow,.wbox{background:var(--paper);border-color:var(--edge)}
th{background:#F1E8D2;color:#1c2547}
.cchip,.tab,.mchip{background:var(--paper);border-color:var(--edge)}
.cchip.on,.tab.on,.mchip.on{background:var(--night);border-color:var(--night)}
.btn.dark{background:var(--night);border-color:var(--night)}
tr.pick:hover td{background:#FBF6E8}tr.pick.sel td{background:#F1E8D2}
.home{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:8px 16px;border-radius:999px;background:var(--paper);border:1.5px solid var(--edge);color:#1c2547;font-weight:700;text-decoration:none}
.home:hover{border-color:var(--night)}

/* 초코볼 다이어그램: 풀이 채점 */
.gwrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start}
.glist{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow-y:auto}
.gitem{text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.gitem.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.gmain{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.gtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.gtools .btn.on{background:var(--ink);color:#fff}
.gscroll{max-height:70vh;overflow:auto;border-radius:10px;background:#F1F2F7}
.gscroll canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.gform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.gform input{font:inherit;font-size:17px;padding:6px 10px;border:2px solid var(--line2);border-radius:10px}
.gform #gsc{width:90px}.gform .grow{flex:1;display:flex;gap:6px;align-items:center}.gform .grow input{flex:1}
.mbar label.mchip{display:inline-flex;gap:6px;align-items:center}
@media (max-width:800px){.gwrap{grid-template-columns:1fr}.glist{flex-direction:row;flex-wrap:wrap;max-height:none}}
</style>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const { esc, rpc, MODE, sb } = Land;
  const SLUG = 'choco-diagram';
  const BUCKET = 'land-files';
  const MAX = { sol1: 20, sol2: 30 };                     // 풀이 ① 수직이등분선 표 20점, ② 폐교 좌표 30점
  const PKEY = { sol1: 'm2', sol2: 'm3' };                // 보관함 파일 이름
  const SNAME = { sol1: '풀이 ① 수직이등분선 표', sol2: '풀이 ② 사라진 학교 좌표' };
  const FLOW = ['T', 'S1', 'S2', 'S5', 'Q', 'MAP', 'S8', 'S10', 'S11', 'END'];
  const SCREEN = { T: '실험 관찰', S1: '사진', S2: '세 점', S5: '수직이등분선·풀이①', Q: '깜짝퀴즈', MAP: '지도(2014·2024)', S8: '도전·풀이②', S10: '학습 확인', S11: '소감', END: '제출 완료' };
  const OLD = { S3: 'T', S4: 'T', S6: 'S5', S71: 'MAP', S72: 'MAP', S73: 'MAP', S9: 'S8' };   // 첫판 기록의 화면 이름
  const EXP = e => e === 'ok' ? '<span class="ok">성공</span>' : e === 'far' ? '<span class="no">다름</span>' : e === 'unknown' ? '<span class="dim">판정 못함</span>' : '<span class="dim">·</span>';
  const EXPT = e => ({ ok: '성공', far: '다름', unknown: '판정 못함' })[e] || '';
  const CELLS = [['AB', 'mid', 'AB 중점'], ['AB', 'slope', 'AB 기울기'], ['AB', 'eq', 'AB 방정식'], ['BC', 'mid', 'BC 중점'], ['BC', 'slope', 'BC 기울기'], ['BC', 'eq', 'BC 방정식']];
  const U = ['전혀 모르겠어요', '조금 알겠어요', '그럭저럭 이해했어요', '잘 이해했어요', '완벽히 이해했어요'];
  const F = ['별로였어요', '조금 아쉬웠어요', '보통이었어요', '재밌었어요', '최고였어요'];
  const FACE = ['😭', '😟', '🙂', '😊', '😄'];
  const VIEW1 = { x0: -30, x1: 30, y0: -20, y1: 20 };
  const MAPW = 1093 / 67.76, MAPH = 859 / 67.76, O1 = Geo.mapOrigin(1);

  let act = null, YEAR = Land.schoolYear(), RUNS = [], ROWS = [], DATA = [], PIN = {}, GR = {};
  const DET = {};
  let tab = 'list', sel = null, timer = null, evalOnly = true, gkey = 'sol1', gsel = null, gOnlyTodo = false;
  let cls = 'all'; try { cls = localStorage.getItem('cd_cls') || 'all'; } catch (e) { }
  const kst = (t, full) => { if (!t) return ''; try { return new Date(t).toLocaleString('ko-KR', Object.assign({ timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }, full ? { year: 'numeric' } : {})); } catch (e) { return ''; } };
  const ago = t => { if (!t) return ''; const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : kst(t); };
  // 학생이 수식 칸에 쓴 LaTeX를 읽기 쉽게 (예: 2^{5}\cdot17 → 2^5×17)
  const pretty = s => String(s || '').replace(/\\cdot|\\times/g, '×').replace(/\\div/g, '÷').replace(/\\left|\\right/g, '').replace(/\^\{([^{}]*)\}/g, '^$1')
    .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g, '√($1)').replace(/\\[,;! ]/g, '');
  const classLabel = k => k === 'all' ? '전체' : Land.classLabel(k);
  const VIEW = () => (cls === 'all' ? DATA : DATA.filter(d => d.cls === cls)).slice().sort((a, b) => a.sid.localeCompare(b.sid) || a.rid - b.rid);
  function note(m, k) { $('msg').innerHTML = m ? `<div class="msg ${k || 'ok'}">${esc(m)}</div>` : ''; }

  /* ───────── 보관함 주소 (선생님 계정으로 10분짜리 주소) ───────── */
  const URLS = {};
  async function signed(paths) {
    const now = Date.now(), need = [...new Set(paths.filter(p => p && !(URLS[p] && URLS[p].until > now)))];
    for (let i = 0; i < need.length; i += 100) {
      const part = need.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(part, 600);
      if (error) throw error;
      (data || []).forEach((s, j) => { URLS[part[j]] = { url: s.signedUrl || null, until: now + (s.signedUrl ? 540000 : 60000) }; });
    }
    const out = {}; paths.forEach(p => { out[p] = URLS[p] && URLS[p].url; }); return out;
  }

  /* ───────── 불러오기 ───────── */
  async function loadDetails(rows) {
    const need = rows.filter(r => !DET[r.record_id] || DET[r.record_id].saved !== r.saved_at);
    let i = 0;
    const worker = async () => { while (i < need.length) { const r = need[i++]; try { const P = await rpc('land_t_record_detail', { p_record_id: r.record_id }); DET[r.record_id] = { saved: r.saved_at, P: P || {} }; } catch (e) { console.warn(e); } } };
    await Promise.all(Array.from({ length: Math.min(8, need.length) }, worker));
  }
  async function load(quiet) {
    if (!quiet) note('불러오는 중…');
    try {
      const [acts, rows, studs, grades] = await Promise.all([rpc('land_t_activities'), rpc('land_t_records', { p_slug: SLUG, p_year: YEAR }), rpc('land_t_students', { p_year: YEAR }).catch(() => []), rpc('land_t_grades', { p_slug: SLUG, p_year: YEAR }).catch(() => [])]);
      GR = {}; (grades || []).forEach(g => { (GR[g.record_id] = GR[g.record_id] || {})[g.key] = g; });
      act = acts.find(a => a.slug === SLUG) || act;
      RUNS = (act ? act.runs : []).filter(r => r.year === YEAR);
      PIN = {}; (studs || []).forEach(s => { PIN[s.id] = s.pin_set; });
      fillRuns();
      const run = $('runSel').value;
      ROWS = rows.filter(r => !run || String(r.run_id) === run);
      await loadDetails(ROWS);
      DATA = ROWS.map(toStudent);
      render();
      if (!quiet) note('');
    } catch (e) { console.error(e); note('불러오지 못했어요. 인터넷 연결을 확인하고 [새로 고침]을 눌러 주세요.', 'no'); }
  }
  function fillRuns() {
    const keep = $('runSel').value;
    const opts = RUNS.map(r => `<option value="${r.id}">${MODE[r.mode]} · ${esc(r.label || '이름 없음')}${r.status === 'closed' ? ' (마감)' : ''}</option>`);
    $('runSel').innerHTML = (RUNS.length > 1 ? '<option value="">모든 운영</option>' : '') + opts.join('') || '<option value="">운영 없음</option>';
    if (keep && RUNS.some(r => String(r.id) === keep)) $('runSel').value = keep;
    else if (RUNS.length > 1) { const open = RUNS.find(r => r.status === 'open'); $('runSel').value = open ? String(open.id) : ''; }
  }
  function lockRun() {
    const v = $('runSel').value;
    if (v) return RUNS.find(r => String(r.id) === v) || null;
    const open = RUNS.filter(r => r.status === 'open');
    return open.length === 1 ? open[0] : null;
  }
  const isClosed = k => { const r = lockRun(); return !!r && (r.status === 'closed' || (r.closed_classes || []).includes(k)); };

  /* ───────── 그리기 ───────── */
  function classBar() {
    const keys = [...new Set([...DATA.map(d => d.cls), ...((lockRun() || {}).target_classes || [])])]
      .sort((a, b) => { const [ga, ca] = a.split('-').map(Number), [gb, cb] = b.split('-').map(Number); return (ga - gb) || (ca - cb); });
    if (cls !== 'all' && !keys.includes(cls)) cls = 'all';
    const cnt = k => k === 'all' ? DATA.length : DATA.filter(d => d.cls === k).length;
    $('classbar').innerHTML = ['all', ...keys].map(k => `<button type="button" class="cchip${k === cls ? ' on' : ''}${k !== 'all' && isClosed(k) ? ' closed' : ''}" data-c="${esc(k)}">${k !== 'all' && isClosed(k) ? '🔒 ' : ''}${esc(classLabel(k))} <small>${cnt(k)}</small></button>`).join('');
    $('classbar').querySelectorAll('.cchip').forEach(b => b.onclick = () => pickClass(b.dataset.c));
    lockBar();
    $('csv').textContent = (cls === 'all' ? '전체' : classLabel(cls)) + ' CSV 내려받기';
    if (cls === 'all' && keys.length > 1) {
      const rowsS = keys.map(k => {
        const L = DATA.filter(d => d.cls === k), n = L.length, avg = n ? (L.reduce((a, d) => a + d.s5ok, 0) / n).toFixed(1) : '0';

    $('view').innerHTML = `<div class="mbar"><label class="mchip"><input type="checkbox" id="mx" ${mapShow.x ? 'checked' : ''}> 2014 학교 X 표시</label><label class="mchip"><input type="checkbox" id="mp" ${mapShow.pick ? 'checked' : ''}> 2024 사라진 곳(동그라미)</label><label class="mchip"><input type="checkbox" id="mc" ${mapShow.cell ? 'checked' : ''}> 남은 6개 학교의 보로노이 경계</label><span class="grow"></span><button class="btn" id="mbig" type="button">크게 보기</button></div>
      <p class="note">${esc(classLabel(cls))} ${V.length}명의 표시를 한 지도에 겹쳤어요. 도전 문제 버전이 달라도 같은 자리로 맞춰 보여 줘요. 경계를 끄면 2014년 인구 지도 위에 보여요.</p><div id="mapbox" style="background:#fff;border-radius:14px;padding:6px"></div>`;
    $('mapbox').appendChild(b.svg);
    [['mx', 'x'], ['mp', 'pick'], ['mc', 'cell']].forEach(([id, k]) => $(id).onchange = e => { mapShow[k] = e.target.checked; mapView(); });
    $('mbig').onclick = () => big(b.svg.cloneNode(true), `${classLabel(cls)} · 지도 모아 보기`);
  }

  /* ---------- 풀이 채점 (사진 위 펜 + 점수) ---------- */
  function gradeView() {
    const all = VIEW(), V = all.filter(d => !gOnlyTodo || (d.files[PKEY[gkey]] && !d.grade[gkey]));
    if (!V.some(d => d.rid === gsel)) { const f = V.find(d => d.files[PKEY[gkey]] && !d.grade[gkey]) || V.find(d => d.files[PKEY[gkey]]); gsel = f ? f.rid : null; }
    const st = d => d.grade[gkey] ? `<span class="ok">${d.grade[gkey].score}점</span>` : d.files[PKEY[gkey]] ? '<span class="no">채점 전</span>' : '<span class="dim">사진 없음</span>';
    $('view').innerHTML = `<div class="mbar">${['sol1', 'sol2'].map(k => `<button type="button" class="mchip${k === gkey ? ' on' : ''}" data-k="${k}">${SNAME[k]} <small>${all.filter(d => d.grade[k]).length}/${all.filter(d => d.files[PKEY[k]]).length}</small></button>`).join('')}
      <label class="mchip"><input type="checkbox" id="gtodo" ${gOnlyTodo ? 'checked' : ''}> 채점 안 한 학생만</label></div>
      <div class="gwrap"><div class="glist" id="glist">${V.map(d => `<button type="button" class="gitem${d.rid === gsel ? ' on' : ''}" data-r="${d.rid}">${esc(d.sid)} ${esc(d.name)}<br>${st(d)}</button>`).join('') || '<p class="note">학생이 없어요.</p>'}</div><div id="gmain" class="gmain"></div></div>`;
    $('view').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { gkey = b.dataset.k; gsel = null; gradeView(); });
    $('gtodo').onchange = e => { gOnlyTodo = e.target.checked; gradeView(); };
    $('glist').onclick = e => { const b = e.target.closest('.gitem'); if (b) { gsel = +b.dataset.r; gradeView(); } };
    const d = DATA.find(x => x.rid === gsel); if (d) grader(d, V);
  }
  function grader(d, V) {
    const g = d.grade[gkey] || {}, m = (g.marks && !Array.isArray(g.marks)) ? g.marks : { rot: 0, s: [] };
    let marks = { rot: m.rot || 0, s: (m.s || []).slice() }, pen = { c: '#E53935', w: 4, erase: false }, hide = false, img = null, zoomK = 1;
    const box = $('gmain');
    if (!d.files[PKEY[gkey]]) { box.innerHTML = `<p>${esc(d.sid)} ${esc(d.name)} 학생은 아직 ${esc(SNAME[gkey])} 사진을 올리지 않았어요.</p>`; }
    else box.innerHTML = `<div class="gtools"><b>${esc(d.sid)} ${esc(d.name)}</b><span class="grow"></span>
        <button class="btn sm gp on" data-c="#E53935" type="button">빨강</button><button class="btn sm gp" data-c="#1E63D6" type="button">파랑</button>
        <button class="btn sm gw" type="button">굵게</button><button class="btn sm ge" type="button">지우개</button><button class="btn sm gu" type="button">되돌리기</button>
        <button class="btn sm gh" type="button">펜 자국 숨기기</button><button class="btn sm gr" type="button">⟳ 90°</button><button class="btn sm gz" type="button">확대 1×</button></div>
      <div class="gscroll"><canvas id="gcv"></canvas></div>`;
    box.insertAdjacentHTML('beforeend', `<div class="gform"><label>점수 <input id="gsc" type="number" inputmode="numeric" min="0" max="${MAX[gkey]}" step="1" value="${g.score ?? ''}"> / ${MAX[gkey]}</label>
      <label class="grow">메모 <input id="gmemo" type="text" maxlength="200" value="${esc(g.memo || '')}"></label><button class="btn primary" id="gsave" type="button">저장하고 다음 학생</button></div><div id="gmsg"></div>`);
    const cv = $('gcv');
    const draw = () => {
      if (!cv || !img) return;
      const r = marks.rot % 4, iw = img.naturalWidth, ih = img.naturalHeight, k = Math.min(1, 1400 / Math.max(iw, ih));
      const w = Math.round((r % 2 ? ih : iw) * k), h = Math.round((r % 2 ? iw : ih) * k); cv.width = w; cv.height = h;
      const c = cv.getContext('2d'); c.save(); c.translate(w / 2, h / 2); c.rotate(r * Math.PI / 2); c.drawImage(img, -iw * k / 2, -ih * k / 2, iw * k, ih * k); c.restore();
      if (!hide) marks.s.forEach(s => { c.strokeStyle = s.c; c.lineWidth = s.w * w / 1000; c.lineCap = c.lineJoin = 'round'; c.beginPath(); s.p.forEach((p, i) => i ? c.lineTo(p[0] * w, p[1] * h) : c.moveTo(p[0] * w, p[1] * h)); c.stroke(); });
      cv.style.width = (zoomK * 100) + '%';
    };
    if (cv) {
      signed([path(d, PKEY[gkey])]).then(u => { const url = u[path(d, PKEY[gkey])]; if (!url) { box.querySelector('.gscroll').textContent = '사진을 찾지 못했어요.'; return; } img = new Image(); img.crossOrigin = 'anonymous'; img.onload = draw; img.src = url; });
      const at = e => { const r = cv.getBoundingClientRect(); return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]; };
      cv.onpointerdown = e => {
        if (hide || !img) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
        if (pen.erase) { const p = at(e); const i = marks.s.findIndex(s => s.p.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < .02)); if (i >= 0) { marks.s.splice(i, 1); draw(); } return; }
        const s = { c: pen.c, w: pen.w, p: [at(e)] }; marks.s.push(s);
        cv.onpointermove = ev => { s.p.push(at(ev)); draw(); };
        cv.onpointerup = cv.onpointercancel = () => { cv.onpointermove = null; if (s.p.length < 2) marks.s.pop(); };
      };
      box.querySelectorAll('.gp').forEach(b => b.onclick = () => { pen.c = b.dataset.c; pen.erase = false; box.querySelectorAll('.gp,.ge').forEach(x => x.classList.toggle('on', x === b)); });
      box.querySelector('.gw').onclick = e => { pen.w = pen.w === 4 ? 9 : 4; e.target.textContent = pen.w === 4 ? '굵게' : '가늘게'; };
      box.querySelector('.ge').onclick = e => { pen.erase = !pen.erase; e.target.classList.toggle('on', pen.erase); };
      box.querySelector('.gu').onclick = () => { marks.s.pop(); draw(); };
      box.querySelector('.gh').onclick = e => { hide = !hide; e.target.textContent = hide ? '펜 자국 보이기' : '펜 자국 숨기기'; draw(); };
      box.querySelector('.gr').onclick = () => { marks.rot = (marks.rot + 1) % 4; marks.s = []; draw(); note('돌리면 펜 자국은 지워져요(사진 방향이 바뀌어서).', 'ok'); };
      box.querySelector('.gz').onclick = e => { zoomK = zoomK === 1 ? 1.5 : zoomK === 1.5 ? 2 : 1; e.target.textContent = `확대 ${zoomK}×`; draw(); };
    }
    $('gsave').onclick = async () => {
      const v = $('gsc').value.trim(), n = Number(v);
      if (v === '' || !Number.isInteger(n) || n < 0 || n > MAX[gkey]) { $('gmsg').innerHTML = `<div class="msg no">점수는 0~${MAX[gkey]} 사이의 정수로 적어 주세요.</div>`; return; }
      $('gsave').disabled = true;
      try {
        const r = await rpc('land_t_grade', { p_record_id: d.rid, p_key: gkey, p_score: n, p_max: MAX[gkey], p_memo: $('gmemo').value, p_marks: marks });
        if (!r || !r.ok) throw new Error((r && r.code) || 'fail');
        GR[d.rid] = Object.assign(GR[d.rid] || {}, { [gkey]: { score: n, memo: $('gmemo').value, marks } }); d.grade = GR[d.rid];
        const nx = V.slice(V.findIndex(x => x.rid === d.rid) + 1).find(x => x.files[PKEY[gkey]] && !x.grade[gkey]);
        note(`${d.sid} ${d.name} ${n}점 저장했어요.` + (nx ? '' : ' 남은 학생이 없어요.'), 'ok');
        gsel = nx ? nx.rid : d.rid; gradeView();
      } catch (e) { console.error(e); $('gmsg').innerHTML = '<div class="msg no">저장하지 못했어요. 다시 눌러 주세요.</div>'; $('gsave').disabled = false; }
    };
  }

  function evalView() {
    const V = VIEW(), wrote = V.filter(d => String(d.eval.c || '').trim());
    const hist = key => { const h = [0, 0, 0, 0, 0]; V.forEach(d => { const v = d.eval[key]; if (d.submitted && v >= 1 && v <= 5) h[v - 1]++; }); return h; };
    const bars = (title, key, labels) => { const h = hist(key), mx = Math.max(1, ...h);
      return `<div class="evbox"><b>${esc(title)}</b>${h.map((n, i) => `<div class="evrow"><span class="evf">${FACE[i]}</span><span>${esc(labels[i])}</span><span class="evbar"><i style="width:${Math.round(n / mx * 100)}%"></i></span><span class="evn">${n}명</span></div>`).join('')}</div>`; };
    const L = evalOnly ? wrote : V;
    const cards = L.map(d => { const e = d.eval, c = String(e.c || '').trim();
      return `<div class="evcard${c ? '' : ' empty'}"><div class="evhd"><b>${esc(d.sid)} ${esc(d.name)}</b><span title="이해도">${e.u ? FACE[e.u - 1] + ' ' + esc(U[e.u - 1]) : ''}</span><span title="수업">${e.f ? FACE[e.f - 1] + ' ' + esc(F[e.f - 1]) : ''}</span></div><div class="evtx">${c ? esc(c) : '<span class="dim">아직 쓰지 않았어요</span>'}</div></div>`; }).join('');
    $('view').innerHTML = `<div class="evtop">${bars('오늘 수학 시간 이해도 (제출한 학생)', 'u', U)}${bars('오늘 수업은 어땠나요? (제출한 학생)', 'f', F)}</div>
      <div class="evtools"><span>${esc(classLabel(cls))} · 한 줄 소감을 쓴 학생 <b>${wrote.length}</b> / ${V.length}명</span>
      <label><input type="checkbox" id="evonly" ${evalOnly ? 'checked' : ''}> 쓴 학생만 보기</label>
      <button class="btn sm" id="evcopy" type="button">모두 복사</button></div>
      ${L.length ? `<div class="evgrid">${cards}</div>` : '<p>아직 소감을 쓴 학생이 없어요.</p>'}`;
    $('evonly').onchange = e => { evalOnly = e.target.checked; evalView(); };
    $('evcopy').onclick = async () => {
      const txt = wrote.map(d => `${d.sid} ${d.name}\t${U[(d.eval.u || 3) - 1]}\t${F[(d.eval.f || 3) - 1]}\t${String(d.eval.c).trim().replace(/\s+/g, ' ')}`).join('\n');
      if (!txt) return note('복사할 소감이 없어요.', 'no');
      let ok = false;
      try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) { }
      if (!ok) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); }
      note(ok ? `소감 ${wrote.length}개를 복사했어요. 한글이나 엑셀에 붙여넣으면 학번·이름·이해도·수업·소감 순으로 들어가요.` : '복사하지 못했어요. 직접 선택해서 복사해 주세요.', ok ? 'ok' : 'no');
    };
  }

  /* ───────── 시작 ───────── */
  /* ───────── 시작 ───────── */
  async function init() {
    const acts = await rpc('land_t_activities');
    act = acts.find(a => a.slug === SLUG);
    if (act) {
      document.title = `${act.title} 현황판 — Math Land Explorers`;
      $('title').textContent = `${act.title} 현황판`;
      $('meta').textContent = `${act.grade_label || ''} · ${act.unit || ''} · 지금 버전 v${act.version}`;
    } else $('meta').innerHTML = '<span class="err">활동(choco-diagram)이 아직 등록되지 않았어요. SQL 파일을 먼저 실행해 주세요.</span>';
    let years = await rpc('land_t_years', { p_slug: SLUG });
    const now = Land.schoolYear();
    if (!years.includes(now)) years = [now, ...years];
    $('yearSel').innerHTML = years.map(y => `<option value="${y}">${y}학년도${y === now ? ' (올해)' : ' (보관)'}</option>`).join('');
    YEAR = +$('yearSel').value;
    await load();
    clearInterval(timer); timer = setInterval(() => { if ((tab === 'list' || tab === 'where') && !document.hidden) load(true); }, 30000);
  }
  $('yearSel').onchange = () => { YEAR = +$('yearSel').value; $('runSel').innerHTML = ''; sel = null; load(); };
  $('runSel').onchange = () => { sel = null; load(); };
  $('refresh').onclick = () => load();
  $('csv').onclick = () => {
    const L = VIEW(); if (!L.length) return note('내려받을 기록이 없어요.', 'no');
    const r = s => s && s.ok ? `맞음(틀림 ${s.wrong || 0})` : s && s.wrong ? `못 맞힘(틀림 ${s.wrong})` : '';
    const head = ['학번', '이름', '반', '운영', '지금 화면', '이웃 경고', ...CELLS.map(c => c[2]), '실험 AB', '실험 BC', '퀴즈(맞힌 수)', '도전 버전', '학교 A', '학교 B', '풀이① 점수(20)', '풀이① 메모', '풀이② 점수(30)', '풀이② 메모', '합계(50)', '이해도', '수업', '한 줄 소감', '관계 쓰기', '마지막 저장', '제출 시각'];
    const body = L.map(d => [d.sid, d.name, classLabel(d.cls), d.run_label || '', SCREEN[d.screen] || d.screen, d.P.nb && d.P.nb.warned ? (d.P.nb.ignored ? '경고 무시' : '경고') : '',
      ...d.cells.map(r), EXPT(d.exp[0]), EXPT(d.exp[1]), d.quiz, d.ver, r(d.s8.A), r(d.s8.B),
      d.grade.sol1 ? d.grade.sol1.score : '', d.grade.sol1 ? d.grade.sol1.memo || '' : '', d.grade.sol2 ? d.grade.sol2.score : '', d.grade.sol2 ? d.grade.sol2.memo || '' : '', total(d),
      d.submitted && d.eval.u ? U[d.eval.u - 1] : '', d.submitted && d.eval.f ? F[d.eval.f - 1] : '', String(d.eval.c || '').trim().replace(/\s+/g, ' '), String(d.P.s3 || '').trim().replace(/\s+/g, ' '),
      kst(d.saved), d.submitted ? kst(d.submitted) : '']);
    const csv = '\ufeff' + [head, ...body].map(x => x.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `초코볼다이어그램_${YEAR}학년도_${cls === 'all' ? '전체' : classLabel(cls)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); note(''); render(); });

  $('logout').addEventListener('click', Land.teacherLogout);
  Land.teacherGate($('gate'), user => {
    $('gate').innerHTML = ''; $('board').classList.remove('hidden');
    $('who').textContent = user.email; $('logout').classList.remove('hidden');
    init().catch(e => { console.error(e); $('meta').innerHTML = '<span class="err">불러오지 못했어요. 새로 고침해 보세요.</span>'; });
  });
})();
</script>
