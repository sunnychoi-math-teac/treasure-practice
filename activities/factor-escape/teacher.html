<style>
main{max-width:1400px}
.top-in{max-width:1400px}
.classbar,.tabs,.mbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cchip,.tab,.mchip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.cchip small,.mchip small{font-weight:400;color:var(--ink3);margin-left:2px}
.cchip.closed{border-color:var(--coral)}
.cchip.on,.tab.on,.mchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cchip.on small,.mchip.on small{color:#D5D9F0}
.tabs{margin-top:8px}
.lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.lock span{color:var(--ink2);font-size:13px;flex:1;min-width:220px}
.lock.on{background:#FCE4E0;border-color:#F2B8AE}.lock.on b{color:#A0362A}
.msg{padding:9px 14px;border-radius:12px;margin:0 0 12px;font-size:14px}
.msg.ok{background:#DFF7EC;color:#1D6B45}.msg.no{background:#FCE4E0;color:#A0362A}
.note{color:var(--ink3);font-size:13px;line-height:1.6;margin:0 0 10px}
.sumwrap{margin:0 0 16px}
tr.pick{cursor:pointer}
#tbl td,#tbl th{text-align:center;white-space:nowrap;padding:7px 8px}
#tbl td.l,#tbl th.l{text-align:left}
.ok{color:var(--green);font-weight:700}.no{color:var(--red)}.dim{color:#B5B9CF}
.esc{display:inline-block;border-radius:12px;padding:1px 9px;font-weight:700;background:#DFF7EC;color:#1D6B45}
.detail{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:14px}
.detail h2{margin:0 0 6px;font-size:19px}
.detail dl{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:6px 14px;margin:8px 0 14px}
.detail dt{font-weight:700}.detail dd{margin:0;word-break:break-all}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.gcard .ph{aspect-ratio:3/4;border-radius:10px;background:var(--sheet);display:grid;place-items:center;color:var(--ink3);overflow:hidden;font-size:13px;text-align:center;padding:4px}
.gcard img{width:100%;height:100%;object-fit:contain;display:block}
.gcard.none{cursor:default;opacity:.75}
.gcard .nm{font-weight:700}.gcard .ty{font-size:13px;color:var(--ink2)}
.ov{position:fixed;inset:0;background:rgba(14,18,32,.88);display:grid;place-items:center;z-index:50;padding:16px;cursor:zoom-out}
.ov img{max-width:100%;max-height:84vh;border-radius:12px;background:#fff;display:block;margin:0 auto}
.ov .cap{color:#fff;font-weight:700;font-size:18px;text-align:center;margin-top:10px}
/* 지금 어디에 */
.where{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.wrow .wn{font-weight:700}.wrow .wn small{display:block;font-weight:400;color:var(--ink3)}
.wrow .ppl{display:flex;flex-wrap:wrap;gap:6px}
.pp{border-radius:999px;padding:3px 10px;background:var(--sheet);font-size:13px}
.pp.stuck{background:#FCE4E0;color:#A0362A;font-weight:700}
.pp.doneP{background:#DFF7EC;color:#1D6B45}
.wbar{height:8px;border-radius:6px;background:var(--sheet);overflow:hidden;margin-top:6px}.wbar i{display:block;height:100%;background:#c9a227}
/* 흔한 오답 */
.wrongs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wbox h3{margin:0 0 4px;font-size:16px}.wbox .sub{font-size:13px;color:var(--ink3);margin:0 0 8px}
.wl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.wl code{background:var(--sheet);border-radius:6px;padding:1px 6px;word-break:break-all;font-family:inherit}
/* 소감 */
.evtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.evbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.evbox b{display:block;margin-bottom:6px}
.evrow{display:grid;grid-template-columns:26px 130px 1fr 44px;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.evf{font-size:18px}.evbar{background:var(--sheet);border-radius:6px;height:12px;overflow:hidden}.evbar i{display:block;height:100%;background:var(--mint);border-radius:6px}.evn{text-align:right;color:var(--ink2)}
.evtools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.evtools label{display:flex;align-items:center;gap:6px;cursor:pointer}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.evcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.evcard.empty{opacity:.65}
.evhd{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink2)}.evhd b{font-size:16px;color:var(--ink);margin-right:auto}
.evtx{white-space:pre-wrap;line-height:1.65;font-size:15px}
/* 방탈출 현황판 고유 색: 밤하늘 남색 머리띠 + 금색 줄 */
:root{--night:#141a30;--gold:#c9a227;--paper:#FFFDF9;--edge:#EADFC8;--line:#ECE3CF;--sheet:#F6F1E4}
body{background:#F4F1EA}
.top{background:var(--night);border-bottom:0;box-shadow:0 3px 0 var(--gold)}
.top .brand,.top .who{color:#F5F2E6}
.top .nav a{color:#D9DEF5}
.top .btn{background:transparent;color:#F5F2E6;border-color:#4A5596}
.card,.stat,.scroll,.detail,.gcard,.evbox,.evcard,.lock,.wrow,.wbox{background:var(--paper);border-color:var(--edge)}
th{background:#F1E8D2;color:#1c2547}
.cchip,.tab,.mchip{background:var(--paper);border-color:var(--edge)}
.cchip.on,.tab.on,.mchip.on{background:var(--night);border-color:var(--night)}
.btn.dark{background:var(--night);border-color:var(--night)}
tr.pick:hover td{background:#FBF6E8}tr.pick.sel td{background:#F1E8D2}
.home{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:8px 16px;border-radius:999px;background:var(--paper);border:1.5px solid var(--edge);color:#1c2547;font-weight:700;text-decoration:none}
.home:hover{border-color:var(--night)}
</style>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const { esc, rpc, MODE, sb } = Land;
  const SLUG = 'factor-escape';
  const BUCKET = 'land-files';
  const ROOMS = [1, 2, 3, 4, 5, 6];
  const RNAME = { 1: '방1 탄생 연도', 2: '방2 감춰진 이름', 3: '방3 파리의 흔적', 4: '방4 수의 비밀', 5: '방5 인수분해의 힘', 6: '방6 마지막 암호' };
  const RANS = { 1: '1776년', 2: '46', 3: '4710', 4: '① 299 ② 10099', 5: '2⁵ × 17', 6: '465873' };
  const SCREEN = { start: '첫 화면', 'warmup-intro': '선수학습 안내', matching: '선수학습', video: '흥미 영상', challenge: '도전 문제', mission: '학습목표',
    'germain-intro': '제르맹 영상', 'transition-escape': '탈출 시작', room1: '방1', room2: '방2', room3: '방3', room4: '방4', room5: '방5', room6: '방6',
    success: '탈출 성공', recap: '정리', reflection: '소감', done: '제출 완료' };
  // 「지금 어디에?」 묶음
  const STAGES = [
    ['warm', '도입', ['start', 'warmup-intro', 'matching', 'video', 'challenge', 'mission', 'germain-intro', 'transition-escape']],
    ['room1', '방1', ['room1']], ['room2', '방2', ['room2']], ['room3', '방3', ['room3']], ['room4', '방4', ['room4']], ['room5', '방5', ['room5']], ['room6', '방6 (최종)', ['room6']],
    ['end', '정리·소감', ['success', 'recap', 'reflection']], ['done', '제출 완료', ['done']]];
  const U = ['전혀 모르겠어요', '조금 알겠어요', '그럭저럭 이해했어요', '잘 이해했어요', '완벽히 이해했어요'];
  const F = ['별로였어요', '조금 아쉬웠어요', '보통이었어요', '재밌었어요', '최고였어요'];
  const FACE = ['😭', '😟', '🙂', '😊', '😄'];

  let act = null, YEAR = Land.schoolYear(), RUNS = [], ROWS = [], DATA = [], PIN = {};
  const DET = {};
  let tab = 'list', sel = null, timer = null, photoRoom = 4, evalOnly = true;
  let cls = 'all'; try { cls = localStorage.getItem('fe_cls') || 'all'; } catch (e) { }

  const kst = (t, full) => { if (!t) return ''; try { return new Date(t).toLocaleString('ko-KR', Object.assign({ timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }, full ? { year: 'numeric' } : {})); } catch (e) { return ''; } };
  const ago = t => { if (!t) return ''; const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : kst(t); };
  // 학생이 수식 칸에 쓴 LaTeX를 읽기 쉽게 (예: 2^{5}\cdot17 → 2^5×17)
  const pretty = s => String(s || '').replace(/\\cdot|\\times/g, '×').replace(/\\div/g, '÷').replace(/\\left|\\right/g, '').replace(/\^\{([^{}]*)\}/g, '^$1')
    .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g, '√($1)').replace(/\\[,;! ]/g, '');
  const classLabel = k => k === 'all' ? '전체' : Land.classLabel(k);
  const VIEW = () => (cls === 'all' ? DATA : DATA.filter(d => d.cls === cls)).slice().sort((a, b) => a.sid.localeCompare(b.sid) || a.rid - b.rid);
  function note(m, k) { $('msg').innerHTML = m ? `<div class="msg ${k || 'ok'}">${esc(m)}</div>` : ''; }

  /* ───────── 보관함 주소 (선생님 계정으로 10분짜리 주소) ───────── */
  const URLS = {};
  async function signed(paths) {
    const now = Date.now(), need = [...new Set(paths.filter(p => p && !(URLS[p] && URLS[p].until > now)))];
    for (let i = 0; i < need.length; i += 100) {
      const part = need.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(part, 600);
      if (error) throw error;
      (data || []).forEach((s, j) => { URLS[part[j]] = { url: s.signedUrl || null, until: now + (s.signedUrl ? 540000 : 60000) }; });
    }
    const out = {}; paths.forEach(p => { out[p] = URLS[p] && URLS[p].url; }); return out;
  }
  const photoPath = (d, n) => { const p = d.P.rooms && d.P.rooms[n] && d.P.rooms[n].photo; return typeof p === 'string' && p.includes('/') ? p : null; };

  /* ───────── 불러오기 ───────── */
  function toStudent(r) {
    const P = (DET[r.record_id] && DET[r.record_id].P) || {};
    const rooms = {}; ROOMS.forEach(n => { const s = (P.rooms || {})[n] || {}; rooms[n] = { solved: !!s.solved, wrong: s.wrong || 0, wrongs: s.wrongs || [], hint: s.hint || 0, photo: s.photo || null, ans: s.ans || '', at: s.at || '', photoAt: s.photoAt || '' }; });
    return {
      rid: r.record_id, run_id: r.run_id, run_label: r.run_label, mode: r.mode, version: r.version, year: YEAR,
      student_id: r.student_id, sid: r.no, name: r.name, cls: `${r.grade}-${r.class_no}`, moved: r.student_status === 'moved',
      P, rooms, solved: ROOMS.filter(n => rooms[n].solved).length, escaped: rooms[6].solved,
      match: P.match || {}, recap: P.recap || {}, eval: P.eval || {}, screen: P.screen || '',
      saved: r.saved_at, submitted: r.finished_at || P.submitted || '', saves: r.save_count
    };
  }
  async function loadDetails(rows) {
    const need = rows.filter(r => !DET[r.record_id] || DET[r.record_id].saved !== r.saved_at);
    let i = 0;
    const worker = async () => { while (i < need.length) { const r = need[i++]; try { const P = await rpc('land_t_record_detail', { p_record_id: r.record_id }); DET[r.record_id] = { saved: r.saved_at, P: P || {} }; } catch (e) { console.warn(e); } } };
    await Promise.all(Array.from({ length: Math.min(8, need.length) }, worker));
  }
  async function load(quiet) {
    if (!quiet) note('불러오는 중…');
    try {
      const [acts, rows, studs] = await Promise.all([rpc('land_t_activities'), rpc('land_t_records', { p_slug: SLUG, p_year: YEAR }), rpc('land_t_students', { p_year: YEAR }).catch(() => [])]);
      act = acts.find(a => a.slug === SLUG) || act;
      RUNS = (act ? act.runs : []).filter(r => r.year === YEAR);
      PIN = {}; (studs || []).forEach(s => { PIN[s.id] = s.pin_set; });
      fillRuns();
      const run = $('runSel').value;
      ROWS = rows.filter(r => !run || String(r.run_id) === run);
      await loadDetails(ROWS);
      DATA = ROWS.map(toStudent);
      render();
      if (!quiet) note('');
    } catch (e) { console.error(e); note('불러오지 못했어요. 인터넷 연결을 확인하고 [새로 고침]을 눌러 주세요.', 'no'); }
  }
  function fillRuns() {
    const keep = $('runSel').value;
    const opts = RUNS.map(r => `<option value="${r.id}">${MODE[r.mode]} · ${esc(r.label || '이름 없음')}${r.status === 'closed' ? ' (마감)' : ''}</option>`);
    $('runSel').innerHTML = (RUNS.length > 1 ? '<option value="">모든 운영</option>' : '') + opts.join('') || '<option value="">운영 없음</option>';
    if (keep && RUNS.some(r => String(r.id) === keep)) $('runSel').value = keep;
    else if (RUNS.length > 1) { const open = RUNS.find(r => r.status === 'open'); $('runSel').value = open ? String(open.id) : ''; }
  }
  function lockRun() {
    const v = $('runSel').value;
    if (v) return RUNS.find(r => String(r.id) === v) || null;
    const open = RUNS.filter(r => r.status === 'open');
    return open.length === 1 ? open[0] : null;
  }
  const isClosed = k => { const r = lockRun(); return !!r && (r.status === 'closed' || (r.closed_classes || []).includes(k)); };

  /* ───────── 그리기 ───────── */
  function render() {
    classBar();
    const V = VIEW(), n = V.length;
    const avg = n ? (V.reduce((a, d) => a + d.solved, 0) / n).toFixed(1) : 0;
    $('stats').innerHTML = [[classLabel(cls) + ' 접속 학생', n], ['평균 통과한 방', avg + ' / 6'], ['탈출 성공', V.filter(d => d.escaped).length], ['소감 제출', V.filter(d => d.submitted).length]]
      .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
    ({ list, where, wrong: wrongView, photo: photoView, eval: evalView })[tab]();
  }
  function classBar() {
    const keys = [...new Set([...DATA.map(d => d.cls), ...((lockRun() || {}).target_classes || [])])]
      .sort((a, b) => { const [ga, ca] = a.split('-').map(Number), [gb, cb] = b.split('-').map(Number); return (ga - gb) || (ca - cb); });
    if (cls !== 'all' && !keys.includes(cls)) cls = 'all';
    const cnt = k => k === 'all' ? DATA.length : DATA.filter(d => d.cls === k).length;
    $('classbar').innerHTML = ['all', ...keys].map(k => `<button type="button" class="cchip${k === cls ? ' on' : ''}${k !== 'all' && isClosed(k) ? ' closed' : ''}" data-c="${esc(k)}">${k !== 'all' && isClosed(k) ? '🔒 ' : ''}${esc(classLabel(k))} <small>${cnt(k)}</small></button>`).join('');
    $('classbar').querySelectorAll('.cchip').forEach(b => b.onclick = () => pickClass(b.dataset.c));
    lockBar();
    $('csv').textContent = (cls === 'all' ? '전체' : classLabel(cls)) + ' CSV 내려받기';
    if (cls === 'all' && keys.length > 1) {
      const rowsS = keys.map(k => {
        const L = DATA.filter(d => d.cls === k), n = L.length, avg = n ? (L.reduce((a, d) => a + d.solved, 0) / n).toFixed(1) : '0';
        return `<tr class="pick" data-c="${esc(k)}"><td><b>${esc(classLabel(k))}</b></td><td class="num">${n}</td><td class="num">${avg} / 6</td><td class="num">${L.filter(d => d.escaped).length}</td><td class="num">${L.filter(d => d.rooms[4].photo).length} / ${L.filter(d => d.rooms[5].photo).length}</td><td class="num">${L.filter(d => d.submitted).length}</td><td>${isClosed(k) ? '<span class="chip closed">🔒 마감</span>' : '<span class="chip open">진행 중</span>'}</td></tr>`;
      }).join('');
      $('clsum').innerHTML = `<div class="scroll sumwrap" style="max-height:none"><table><thead><tr><th>반</th><th class="num">학생 수</th><th class="num">평균 통과</th><th class="num">탈출 성공</th><th class="num">풀이 사진(방4/방5)</th><th class="num">소감 제출</th><th>상태</th></tr></thead><tbody>${rowsS}</tbody></table></div>`;
      $('clsum').querySelectorAll('tr.pick').forEach(r => r.onclick = () => pickClass(r.dataset.c));
    } else $('clsum').innerHTML = '';
  }
  function pickClass(c) { cls = c; try { localStorage.setItem('fe_cls', cls); } catch (e) { } sel = null; render(); }
  function lockBar() {
    const box = $('lockbar');
    if (cls === 'all') { box.innerHTML = ''; return; }
    const run = lockRun();
    if (!run) { box.innerHTML = `<div class="lock"><b>${esc(classLabel(cls))}</b><span>위에서 운영을 하나 고르면 이 반을 마감하거나 마감을 풀 수 있어요.</span></div>`; return; }
    if (run.status === 'closed') { box.innerHTML = `<div class="lock on"><b>🔒 운영 전체가 마감됨</b><span>「${esc(run.label || '이름 없음')}」 운영 전체가 마감되어 있어요. 다시 열려면 활동 모음에서 운영을 여세요.</span></div>`; return; }
    const at = (run.closed_classes || []).includes(cls);
    box.innerHTML = at
      ? `<div class="lock on"><b>🔒 ${esc(classLabel(cls))} 마감됨</b><span>학생들은 이 반 기록을 더 이상 고치거나 제출할 수 없어요. (운영: ${esc(run.label || '이름 없음')})</span><button class="btn sm" id="lockbtn" type="button">마감 풀기</button></div>`
      : `<div class="lock"><b>${esc(classLabel(cls))} 진행 중</b><span>마감하면 이 반 학생들은 저장·제출을 할 수 없고, 지금 기록이 그대로 남아요. (운영: ${esc(run.label || '이름 없음')})</span><button class="btn sm warn" id="lockbtn" type="button">이 반 마감하기</button></div>`;
    let armed = false; const b = $('lockbtn');
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = at ? '정말 마감을 풀까요? 한 번 더 누르세요' : '정말 마감할까요? 한 번 더 누르세요'; return; }
      b.disabled = true;
      try { run.closed_classes = await rpc('land_t_close_class', { p_id: run.id, p_class: cls, p_closed: !at }) || []; note(at ? classLabel(cls) + ' 마감을 풀었어요.' : classLabel(cls) + '을 마감했어요.', 'ok'); render(); }
      catch (e) { console.error(e); note('바꾸지 못했어요. 다시 눌러 주세요.', 'no'); b.disabled = false; }
    };
  }

  /* ---------- 진행 현황 ---------- */
  const cell = s => s.solved ? `<span class="ok">✓</span>${s.wrong ? `<span class="dim"> ${s.wrong}</span>` : ''}` : (s.wrong ? `<span class="no">✗${s.wrong}</span>` : '<span class="dim">·</span>');

  function list() {

      <td>${matchCell(d.match)}</td>${ROOMS.map(n => `<td>${cell(d.rooms[n])}</td>`).join('')}<td><b>${d.solved}</b>/6</td>
      <td>${d.rooms[5].hint || 0} · ${d.rooms[6].hint || 0}</td><td>${camera(d)}</td><td>${esc(SCREEN[d.screen] || d.screen || '')}</td><td>${esc(ago(d.saved))}</td>
      <td>${d.submitted ? '<span class="ok">✓</span> ' + esc(kst(d.submitted)) : '<span class="dim">·</span>'}</td></tr>`).join('');
    $('view').innerHTML = `<p class="note">✓ 통과 (옆 숫자는 통과 전 틀린 횟수) · ✗n 아직 못 풂(틀림 n번) · 힌트는 「방5 · 방6」에서 본 개수 · 사진은 풀이 사진을 올린 방(초록) · 학생을 누르면 자세한 기록이 보여요. 30초마다 자동으로 새로 고쳐져요.</p>
    <div class="scroll"><table id="tbl"><thead><tr><th>학번</th><th class="l">이름</th><th>선수학습</th><th>방1</th><th>방2</th><th>방3</th><th>방4</th><th>방5</th><th>방6</th><th>통과</th><th>힌트(5·6)</th><th>사진</th><th>지금 화면</th><th>마지막 저장</th><th>소감 제출</th></tr></thead><tbody>${rows || `<tr><td colspan="15" class="muted">아직 접속한 학생이 없어요.</td></tr>`}</tbody></table></div><div id="det"></div>`;
    const tb = $('tbl');
    tb.onclick = e => { const tr = e.target.closest('tr.pick'); if (tr) { sel = +tr.dataset.r; tb.querySelectorAll('tr.pick').forEach(x => x.classList.toggle('sel', x === tr)); detail(); } };
    tb.onkeydown = e => { const tr = e.target.closest('tr.pick'); if (tr && e.key === 'Enter') tr.click(); };
    if (sel) detail();
  }
  function detail() {
    const d = DATA.find(x => x.rid === sel); if (!d) { $('det').innerHTML = ''; return; }
    const m = d.match;
    $('det').innerHTML = `<div class="detail"><h2>${esc(d.sid)} ${esc(d.name)}</h2>
    <p class="muted" style="margin:0">${esc(MODE[d.mode] || '')} · ${esc(d.run_label || '')} · 버전 v${esc(d.version)} · 저장 ${d.saves}번 · 지금 화면: ${esc(SCREEN[d.screen] || d.screen || '')}</p>
    <dl><dt>선수학습(선 잇기)</dt><dd>${m.done ? `<span class="ok">완료</span> · ${m.time}초` : m.skipped ? '<span class="no">다 잇지 않고 넘어감</span>' : '<span class="dim">아직</span>'} · 틀린 선 ${m.wrong || 0}개${m.over ? ' · 30초 넘김' : ''}${m.tries > 1 ? ` · ${m.tries}번 시작` : ''}</dd>
    ${ROOMS.map(n => { const s = d.rooms[n]; return `<dt>${RNAME[n]}</dt><dd>${s.solved ? '<span class="ok">통과</span>' : '<span class="no">미통과</span>'} · 틀림 ${s.wrong}번${s.at ? ' · ' + esc(kst(s.at)) : ''}${n >= 5 ? ` · 힌트 ${s.hint}개` : ''}${s.wrongs.length ? `<br><span class="muted">틀린 답: ${s.wrongs.map(w => esc(pretty(w))).join(' / ')}</span>` : ''}${n === 4 || n === 5 ? `<br>${s.solved ? '입력: ' + esc(pretty(s.ans)) + ' · ' : ''}${s.photo ? `<button class="btn sm" data-ph="${n}" type="button">📷 풀이 사진 보기</button>` : '<span class="dim">풀이 사진 없음</span>'}` : ''}</dd>`; }).join('')}
    <dt>정리(11⁴+4¹¹)</dt><dd>${d.recap.ok ? '<span class="ok">스스로 소인수분해 완성</span>' : d.recap.shown ? '풀이 보기로 확인' : '<span class="dim">아직</span>'}${d.recap.tries ? ` · 시도 ${d.recap.tries}번` : ''}${d.recap.ans ? ' · 마지막 입력: ' + esc(pretty(d.recap.ans)) : ''}</dd>
    <dt>이해도 / 수업</dt><dd>${d.eval.u ? esc(U[d.eval.u - 1]) + ' / ' + esc(F[(d.eval.f || 3) - 1]) : '<span class="dim">없음</span>'}</dd>
    <dt>새롭게 알게 된 점</dt><dd>${esc(d.eval.c) || '<span class="dim">없음</span>'}</dd>
    <dt>소감 제출</dt><dd>${d.submitted ? esc(kst(d.submitted)) : '<span class="dim">아직</span>'}</dd></dl>
    <div class="btns"><button class="btn warn" id="rst" type="button">비밀번호 초기화</button></div><div id="dm" style="margin-top:10px"></div></div>`;
    $('det').querySelectorAll('[data-ph]').forEach(b => b.onclick = async () => {
      const n = +b.dataset.ph, p = photoPath(d, n); if (!p) return;
      try { const u = (await signed([p]))[p]; if (u) zoom(u, `${RNAME[n]} 풀이 · ${d.sid} ${d.name}`); else note('사진을 찾지 못했어요.', 'no'); } catch (e) { note('사진을 불러오지 못했어요.', 'no'); }
    });
    let armed = false;
    $('rst').onclick = async () => {
      if (!armed) { armed = true; $('rst').textContent = '정말 초기화할까요? 한 번 더 누르세요'; return; }
      $('rst').disabled = true;
      try { await rpc('land_t_reset_pin', { p_student_id: d.student_id }); PIN[d.student_id] = false; $('dm').innerHTML = '<div class="msg ok">초기화했어요. 학생이 같은 학번·이름으로 들어와 새 비밀번호를 만들면 기록은 그대로 이어져요.</div>'; }
      catch (e) { console.error(e); $('dm').innerHTML = '<div class="msg no">초기화하지 못했어요. 다시 눌러 주세요.</div>'; $('rst').disabled = false; }
    };
  }

  /* ---------- 지금 어디에? ---------- */
  function where() {
    const V = VIEW(), mx = Math.max(1, V.length);
    const html = STAGES.map(([key, label, screens]) => {
      const L = V.filter(d => screens.includes(d.screen || 'start'));
      const rn = key.startsWith('room') ? +key.slice(4) : 0;
      const pp = L.map(d => {
        const s = rn ? d.rooms[rn] : null, stuck = s && !s.solved && s.wrong >= 3;
        return `<span class="pp${stuck ? ' stuck' : ''}${key === 'done' ? ' doneP' : ''}" title="마지막 저장 ${esc(ago(d.saved))}">${esc(d.sid)} ${esc(d.name)}${s && s.wrong ? ` · 틀림${s.wrong}` : ''}${s && s.solved ? ' ✓' : ''}</span>`;
      }).join('');
      return `<div class="wrow"><div class="wn">${esc(label)} <small>${L.length}명</small><div class="wbar"><i style="width:${Math.round(L.length / mx * 100)}%"></i></div></div><div class="ppl">${pp || '<span class="dim">없음</span>'}</div></div>`;
    }).join('');
    $('view').innerHTML = `<p class="note">학생이 지금 보고 있는 화면이에요(마지막으로 저장된 위치). <span class="pp stuck" style="font-size:12px">빨간 이름</span>은 그 방에서 3번 이상 틀리고 아직 못 푼 학생이에요. 30초마다 자동으로 새로 고쳐져요.</p><div class="where">${html}</div>`;
  }

  /* ---------- 흔한 오답 ---------- */
  function wrongView() {
    const V = VIEW();
    const boxes = ROOMS.map(n => {
      const cnt = {}; V.forEach(d => d.rooms[n].wrongs.forEach(w => { w = pretty(w); cnt[w] = (cnt[w] || 0) + 1; }));
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const who = V.filter(d => d.rooms[n].wrong).length, solved = V.filter(d => d.rooms[n].solved).length;
      const firstTry = V.filter(d => d.rooms[n].solved && !d.rooms[n].wrong).length;
      return `<div class="wbox"><h3>${RNAME[n]}</h3><p class="sub">정답 ${esc(RANS[n])} · 통과 ${solved}명(한 번에 ${firstTry}명) · 틀려 본 학생 ${who}명</p>
        ${top.length ? `<div class="wl">${top.map(([w, c]) => `<code>${esc(w)}</code><span>${c}번</span>`).join('')}</div>` : '<span class="dim">아직 틀린 답이 없어요</span>'}</div>`;
    }).join('');
    $('view').innerHTML = `<p class="note">학생들이 많이 입력한 틀린 답이에요(학생마다 최근 20개까지 저장). 방4는 ①·② 두 칸을 함께 보여 줘요. 수업 중 짚어 줄 오개념을 찾을 때 쓰세요.</p><div class="wrongs">${boxes}</div>`;
  }

  /* ---------- 풀이 사진 ---------- */
  function photoView() {
    const V = VIEW(), n = photoRoom, items = [];
    const cnt = k => V.filter(d => photoPath(d, k)).length;
    const cards = V.map(d => {
      const p = photoPath(d, n), s = d.rooms[n];
      if (p) { const id = 'ph' + d.rid; items.push({ path: p, ph: id, alt: `${d.name}의 ${RNAME[n]} 풀이` });
        return `<button type="button" class="gcard" data-n="${esc(d.sid + ' ' + d.name)}"><div class="ph" id="${id}">불러오는 중…</div><div class="nm">${esc(d.sid)} ${esc(d.name)}</div><div class="ty">${s.solved ? '<span class="ok">통과</span>' : '<span class="no">미통과</span>'} · 틀림 ${s.wrong}번 · ${esc(kst(s.photoAt))}</div></button>`; }
      return `<div class="gcard none"><div class="ph">${s.solved ? '통과했지만 사진을 안 올렸어요' : '아직 사진 없음'}</div><div class="nm">${esc(d.sid)} ${esc(d.name)}</div><div class="ty">${s.solved ? '<span class="ok">통과</span>' : ''}</div></div>`;
    }).join('');
    $('view').innerHTML = `<div class="mbar">${[4, 5].map(k => `<button type="button" class="mchip${k === n ? ' on' : ''}" data-m="${k}">${esc(RNAME[k])} <small>${cnt(k)}/${V.length}</small></button>`).join('')}</div>
      <p class="note">학생이 올린 학습지 풀이 사진이에요. 사진을 누르면 크게 보여요.</p>
      ${V.length ? `<div class="gallery">${cards}</div>` : '<p>아직 접속한 학생이 없어요.</p>'}`;
    $('view').querySelectorAll('.mchip').forEach(b => b.onclick = () => { photoRoom = +b.dataset.m; photoView(); });
    $('view').querySelectorAll('button.gcard').forEach(c => c.onclick = () => { if (c.dataset.src) zoom(c.dataset.src, `${RNAME[n]} 풀이 · ${c.dataset.n}`); });
    fillImages(items, () => tab === 'photo' && photoRoom === n);
  }
  async function fillImages(items, alive) {
    if (!items.length) return;
    try {
      const urls = await signed(items.map(x => x.path));
      if (!alive()) return;
      items.forEach(x => { const ph = document.getElementById(x.ph); if (!ph) return; const u = urls[x.path];
        ph.innerHTML = u ? `<img alt="${esc(x.alt)}" src="${esc(u)}" loading="lazy">` : '사진 없음';
        const img = ph.querySelector('img'); if (img) img.onerror = () => { ph.textContent = '사진 없음'; };
        ph.closest('.gcard').dataset.src = u || ''; });
    } catch (e) { console.error(e); items.forEach(x => { const ph = document.getElementById(x.ph); if (ph) ph.textContent = '불러오지 못했어요'; }); }
  }
  function zoom(src, cap) {
    const o = document.createElement('div'); o.className = 'ov'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', cap);
    o.innerHTML = `<div style="max-width:min(94vw,1000px)"><img alt="${esc(cap)}" src="${esc(src)}"><div class="cap">${esc(cap)}</div></div>`;
    const close = () => { o.remove(); document.removeEventListener('keydown', key); };
    const key = e => { if (e.key === 'Escape') close(); };
    o.onclick = close; document.addEventListener('keydown', key); document.body.appendChild(o);
  }

  /* ---------- 소감 모아 보기 ---------- */
  function evalView() {
    const V = VIEW(), wrote = V.filter(d => String(d.eval.c || '').trim());
    const hist = key => { const h = [0, 0, 0, 0, 0]; V.forEach(d => { const v = d.eval[key]; if (d.submitted && v >= 1 && v <= 5) h[v - 1]++; }); return h; };
    const bars = (title, key, labels) => { const h = hist(key), mx = Math.max(1, ...h);
      return `<div class="evbox"><b>${esc(title)}</b>${h.map((n, i) => `<div class="evrow"><span class="evf">${FACE[i]}</span><span>${esc(labels[i])}</span><span class="evbar"><i style="width:${Math.round(n / mx * 100)}%"></i></span><span class="evn">${n}명</span></div>`).join('')}</div>`; };
    const L = evalOnly ? wrote : V;
    const cards = L.map(d => { const e = d.eval, c = String(e.c || '').trim();
      return `<div class="evcard${c ? '' : ' empty'}"><div class="evhd"><b>${esc(d.sid)} ${esc(d.name)}</b><span title="이해도">${e.u ? FACE[e.u - 1] + ' ' + esc(U[e.u - 1]) : ''}</span><span title="수업">${e.f ? FACE[e.f - 1] + ' ' + esc(F[e.f - 1]) : ''}</span></div><div class="evtx">${c ? esc(c) : '<span class="dim">아직 쓰지 않았어요</span>'}</div></div>`; }).join('');
    $('view').innerHTML = `<div class="evtop">${bars('오늘 수학 시간 이해도 (제출한 학생)', 'u', U)}${bars('오늘 수업은 어땠나요? (제출한 학생)', 'f', F)}</div>
      <div class="evtools"><span>${esc(classLabel(cls))} · 새롭게 알게 된 점을 쓴 학생 <b>${wrote.length}</b> / ${V.length}명</span>
      <label><input type="checkbox" id="evonly" ${evalOnly ? 'checked' : ''}> 쓴 학생만 보기</label>
      <button class="btn sm" id="evcopy" type="button">모두 복사</button></div>
      ${L.length ? `<div class="evgrid">${cards}</div>` : '<p>아직 소감을 쓴 학생이 없어요.</p>'}`;
    $('evonly').onchange = e => { evalOnly = e.target.checked; evalView(); };
    $('evcopy').onclick = async () => {
      const txt = wrote.map(d => `${d.sid} ${d.name}\t${U[(d.eval.u || 3) - 1]}\t${F[(d.eval.f || 3) - 1]}\t${String(d.eval.c).trim().replace(/\s+/g, ' ')}`).join('\n');
      if (!txt) return note('복사할 소감이 없어요.', 'no');
      let ok = false;
      try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) { }
      if (!ok) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); }
      note(ok ? `소감 ${wrote.length}개를 복사했어요. 한글이나 엑셀에 붙여넣으면 학번·이름·이해도·수업·소감 순으로 들어가요.` : '복사하지 못했어요. 직접 선택해서 복사해 주세요.', ok ? 'ok' : 'no');
    };
  }

  /* ───────── 시작 ───────── */
  async function init() {
    const acts = await rpc('land_t_activities');
    act = acts.find(a => a.slug === SLUG);
    if (act) {
      document.title = `${act.title} 현황판 — Math Land Explorers`;
      $('title').textContent = `${act.title} 현황판`;
      $('meta').textContent = `${act.grade_label || ''} · ${act.unit || ''} · 지금 버전 v${act.version}`;
    } else $('meta').innerHTML = '<span class="err">활동(factor-escape)이 아직 등록되지 않았어요. SQL 파일을 먼저 실행해 주세요.</span>';
    let years = await rpc('land_t_years', { p_slug: SLUG });
    const now = Land.schoolYear();
    if (!years.includes(now)) years = [now, ...years];
    $('yearSel').innerHTML = years.map(y => `<option value="${y}">${y}학년도${y === now ? ' (올해)' : ' (보관)'}</option>`).join('');
    YEAR = +$('yearSel').value;
    await load();
    clearInterval(timer); timer = setInterval(() => { if ((tab === 'list' || tab === 'where') && !document.hidden) load(true); }, 30000);
  }
  $('yearSel').onchange = () => { YEAR = +$('yearSel').value; $('runSel').innerHTML = ''; sel = null; load(); };
  $('runSel').onchange = () => { sel = null; load(); };
  $('refresh').onclick = () => load();
  $('csv').onclick = () => {
    const L = VIEW(); if (!L.length) return note('내려받을 기록이 없어요.', 'no');
    const head = ['학번', '이름', '반', '운영', '선수학습', '선수학습 시간(초)', '선수학습 틀린 선', ...ROOMS.map(n => '방' + n), '통과한 방', '방5 힌트', '방6 힌트', '방4 사진', '방5 사진', '정리', '이해도', '수업', '새롭게 알게 된 점', '지금 화면', '마지막 저장', '소감 제출'];
    const body = L.map(d => [d.sid, d.name, classLabel(d.cls), d.run_label || '',
      d.match.done ? '완료' : d.match.skipped ? '넘어감' : '', d.match.time || '', d.match.wrong || 0,
      ...ROOMS.map(n => d.rooms[n].solved ? `통과(틀림 ${d.rooms[n].wrong})` : (d.rooms[n].wrong ? `미통과(틀림 ${d.rooms[n].wrong})` : '')),
      d.solved, d.rooms[5].hint || 0, d.rooms[6].hint || 0, d.rooms[4].photo ? 'O' : '', d.rooms[5].photo ? 'O' : '',
      d.recap.ok ? '스스로 완성' : d.recap.shown ? '풀이 보기' : '',
      d.submitted && d.eval.u ? U[d.eval.u - 1] : '', d.submitted && d.eval.f ? F[d.eval.f - 1] : '', String(d.eval.c || '').trim().replace(/\s+/g, ' '),
      SCREEN[d.screen] || d.screen || '', kst(d.saved), d.submitted ? kst(d.submitted) : '']);
    const csv = '﻿' + [head, ...body].map(x => x.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `FACTOR_ESCAPE_${YEAR}학년도_${cls === 'all' ? '전체' : classLabel(cls)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); note(''); render(); });

  $('logout').addEventListener('click', Land.teacherLogout);
  Land.teacherGate($('gate'), user => {
    $('gate').innerHTML = ''; $('board').classList.remove('hidden');
    $('who').textContent = user.email; $('logout').classList.remove('hidden');
    init().catch(e => { console.error(e); $('meta').innerHTML = '<span class="err">불러오지 못했어요. 새로 고침해 보세요.</span>'; });
  });
})();
</script>
</body>
