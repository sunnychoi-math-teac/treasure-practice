<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>보물을 찾아라 (연습)</title>
<meta name="author" content="경남고등학교 수학과 최선지">
<meta name="copyright" content="© 2026 경남고등학교 수학과 최선지 선생님. CC BY-NC 4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.108.2/mathlive.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../common/land.js"></script>
<style>
/* 탐험 일지 — 바다빛 표지 + 모래빛 지면 + 황동 포인트. 한 가지 테마로 고정 */
:root{
  --ink:#1d2a2f; --ink-soft:#4b5b60;
  --sea:#0e5a68; --sea-deep:#0a3640; --sea-light:#d5ecee;
  --sand:#efe4c6; --paper:#fbf4e1; --paper-edge:#e2d1a4;
  --brass:#c48a1c; --brass-deep:#94650c;
  --leaf:#2c8a4a; --leaf-bg:#e2f3e5; --coral:#c9472f; --coral-bg:#fbe7e1;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.45),transparent 40%),radial-gradient(circle at 85% 80%,rgba(196,138,28,.10),transparent 45%);
  -webkit-text-size-adjust:100%;}
button{font-family:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
.app{min-height:100%;display:flex;flex-direction:column}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:30;background:var(--sea-deep);color:#f4ead0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 0 var(--brass)}
.topbar .brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;white-space:nowrap}
.topbar .who{font-size:14px;opacity:.85;white-space:nowrap}
.topbar .spacer{flex:1}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:34px;height:30px;border-radius:15px;border:1.5px solid rgba(244,234,208,.45);display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;padding:0 8px;color:#f4ead0;background:transparent;cursor:pointer}
.chip.map{background:#f4ead0;color:var(--sea-deep);border-color:#f4ead0;font-weight:700}
.chip.done{background:var(--brass);border-color:var(--brass);color:#fff}
.chip.here{outline:2px solid #fff;outline-offset:1px}
.demo-flag{background:var(--coral);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}

/* 본문 */
.main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.screen-title .tag{font-family:var(--display);color:var(--brass-deep);font-size:18px}
.screen-title h2{font-size:28px}

.two{display:grid;grid-template-columns:minmax(300px,0.9fr) 1.25fr;gap:20px;align-items:start}
.two>*{min-width:0}
@media (min-width:901px){.two>.panel:last-child{position:sticky;top:64px}}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* 단서 카드 (두루마리) */
.clue{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;padding:16px 18px;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 18px -12px rgba(60,40,0,.35)}
.clue::before,.clue::after{content:"";position:absolute;left:-6px;right:-6px;height:12px;background:var(--paper-edge);border-radius:6px}
.clue::before{top:-6px}.clue::after{bottom:-6px}
.clue h3{font-size:19px;color:var(--brass-deep);margin-bottom:6px}
.clue p{margin:.2em 0}
.clue b{color:var(--sea-deep)}
.panel{display:flex;flex-direction:column;gap:14px}
.task{font-weight:700}
.note{font-size:14px;color:var(--ink-soft)}
.rules{margin:0;padding-left:20px}
.rules li{margin:2px 0}
.rules li.bad{color:var(--coral);font-weight:700}
.rules li.good{color:var(--leaf)}

/* 그래프 */
.graph{position:relative;width:100%;background:#fff;border-radius:10px;overflow:hidden;
  border:3px solid #7a5a22;box-shadow:inset 0 0 0 2px #e8cf8f,0 10px 22px -14px rgba(0,0,0,.5);touch-action:none}
.graph canvas{display:block;width:100%;height:100%}
.graph .gtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.gbtn{background:var(--sea);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
.gbtn.alt{background:#fff;color:var(--sea);border:1.5px solid var(--sea)}

/* 입력 */
.answer{display:flex;flex-direction:column;gap:8px}
.ans-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.ans-row .lbl{display:flex;align-items:center;font-family:var(--display);font-size:18px;min-width:2.2em}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
math-field,.mf-fallback{flex:1;min-width:180px;font-size:22px;border:2px solid #c9b47c;border-radius:10px;background:#fff;padding:6px 10px;
  --caret-color:var(--sea);--selection-background-color:var(--sea-light);--primary:var(--sea)}
math-field:focus-within,.mf-fallback:focus{outline:3px solid rgba(14,90,104,.35);border-color:var(--sea)}
math-field::part(menu-toggle){display:none}
math-field::part(virtual-keyboard-toggle){display:none}
.mf-fallback{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px}
.btn{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:17px;cursor:pointer;min-height:46px;font-family:var(--display);letter-spacing:.3px}
.btn:hover{background:var(--sea-deep)}
.btn:focus-visible,.chip:focus-visible,.gbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn.brass{background:var(--brass)}.btn.brass:hover{background:var(--brass-deep)}
.btn.ghost{background:transparent;color:var(--sea);border:2px solid var(--sea)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px}
.fb{border-radius:10px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--leaf-bg);color:var(--leaf);border:1.5px solid #9fd1ad}
.fb.no{background:var(--coral-bg);color:var(--coral);border:1.5px solid #efb4a5}
.fb.info{background:var(--sea-light);color:var(--sea-deep)}
.solved-banner{display:flex;align-items:center;gap:14px;background:var(--leaf);color:#fff;border-radius:12px;padding:12px 16px;flex-wrap:wrap}
.solved-banner .stamp{font-family:var(--display);font-size:24px;border:3px solid #fff;border-radius:10px;padding:2px 10px;transform:rotate(-6deg);animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.solved-banner .sp{flex:1;min-width:140px}

/* 표 (미션5) */
table.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{border:1px solid #d9c99a;padding:8px;vertical-align:middle}
.tbl th{background:#f3e7c4;font-weight:700;text-align:left;width:38%}
.tbl td math-field,.tbl td .mf-fallback{width:100%;min-width:0}
.tbl td.ok{background:var(--leaf-bg)}.tbl td.no{background:var(--coral-bg)}

/* 하단 내비 */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,54,64,.96);display:flex;justify-content:center;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navbar .btn{min-width:110px;background:#f4ead0;color:var(--sea-deep)}
.navbar .btn.home{background:var(--brass);color:#fff}

/* 로그인 */
.login-wrap{min-height:100%;display:grid;place-items:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--sea-deep),var(--sea) 60%,#3c8d8f)}
.login{width:min(460px,100%);background:var(--paper);border-radius:16px;padding:26px 24px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.login h1{font-size:34px;color:var(--sea-deep)}
.login .sub{color:var(--ink-soft);margin-top:-6px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:15px}
.field input{font-size:20px;padding:10px 12px;border:2px solid #c9b47c;border-radius:10px;background:#fff;font-family:inherit}
.field input:focus{outline:3px solid rgba(14,90,104,.3);border-color:var(--sea)}
.login-hero{display:flex;align-items:center;gap:14px}
.login-hero img{width:64px}

/* 안내 · 문 */
.intro{max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.intro p{margin:0;font-size:19px}
.intro .boy{width:120px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #d9c99a;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:17px;text-align:left}
.choice:hover{border-color:var(--sea)}
.choice.sel{border-color:var(--sea);background:var(--sea-light)}
.scene{width:100%;border-radius:10px;border:3px solid #7a5a22;display:block}
.painting-caption{background:#111;color:#fff;text-align:center;font-family:var(--display);font-size:18px;padding:6px}

/* 지도(허브) */
.hub{position:relative;width:100%;max-width:1100px;margin:0 auto;border-radius:14px;overflow:hidden;border:3px solid #7a5a22;background:#fff}
.hub img.base{display:block;width:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:0;background:none;padding:0}
.pin .flag{background:var(--sea-deep);color:#fff;font-family:var(--display);font-size:clamp(11px,1.5vw,16px);padding:3px 9px;border-radius:9px;white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.pin.done .flag{background:var(--brass)}
.pin .stem{width:3px;height:14px;background:var(--sea-deep)}
.pin.done .stem{background:var(--brass)}
.hub .walker{position:absolute;width:4.2%;transform:translate(-50%,-92%);pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.hub-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* 걷기 장면 */
.walk{position:fixed;inset:0;z-index:60;background:rgba(6,30,36,.86);display:grid;place-items:center;padding:16px}
.walk .stage{position:relative;width:min(1100px,100%);border-radius:14px;overflow:hidden;border:3px solid var(--brass)}
.walk .stage img.base{display:block;width:100%}
.walk .walker{position:absolute;width:4.6%;transform:translate(-50%,-92%);filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.walk .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-family:var(--display);font-size:clamp(16px,2.4vw,26px);padding:28px 18px 14px;text-align:center}
.walk .skip{position:absolute;right:12px;top:12px}
@media (prefers-reduced-motion:reduce){.solved-banner .stamp{animation:none}}

/* 테셀레이션 */
.tess-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ttype{background:#fff;border:2px solid #d9c99a;border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.ttype canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#fffdf6}
.ttype.sel{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-light)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{width:44px;height:44px;border-radius:10px;border:2px solid #d9c99a;background:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center}
.tool.sel{border-color:var(--sea);background:var(--sea-light)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9c99a;cursor:pointer}
.swatch.sel{box-shadow:0 0 0 3px var(--sea)}
.tess-canvas{width:100%;max-width:640px;aspect-ratio:1;background:#fffdf6;border:3px solid #7a5a22;border-radius:10px;touch-action:none;display:block}

/* 마무리 */
.slider-card{background:#fff;border:2px solid #d9c99a;border-radius:12px;padding:14px 16px}
.slider-card input[type=range]{width:100%;accent-color:var(--sea)}
.slider-card .val{font-family:var(--display);font-size:20px;color:var(--sea-deep);text-align:center}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;border:2px solid #c9b47c;border-radius:10px;padding:10px;background:#fff}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.summary .s{background:#fff;border:1.5px solid #d9c99a;border-radius:10px;padding:8px 10px;font-size:15px}
.summary .s b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.summary .s.done{border-color:#9fd1ad;background:var(--leaf-bg)}
.letter{max-width:980px;margin:0 auto;border-radius:12px;overflow:hidden;border:3px solid var(--brass)}
.letter img{display:block;width:100%}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sea-deep);color:#f4ead0;z-index:80;font-family:var(--display);font-size:22px;text-align:center;padding:16px}
.loading .bar{width:min(320px,80vw);height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px auto 0}
.loading .bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .2s}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;z-index:90;font-size:15px}
.hint{font-size:15px;background:#fff7dd;border:1.5px dashed var(--brass);border-radius:10px;padding:8px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){.two>.panel:last-child{order:-1}}
@media (max-width:700px){.topbar{position:static}.topbar .brand{font-size:19px}}

.walk .stage.scene2{width:min(860px,100%)}
.walk .tele{position:absolute;width:7%;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #fff6a8);animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px #fff6a8)}to{filter:drop-shadow(0 0 16px #ffe14d)}}
.ans-row .mark{min-width:4.2em;font-size:15px;color:var(--leaf)}

.slider-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.slider-row input{flex:1}
.face{font-size:34px;line-height:1}
.face-now{font-size:52px;text-align:center;line-height:1.1}
.two.even{grid-template-columns:1fr 1fr}
@media (max-width:900px){.two.even{grid-template-columns:1fr}.two.even>.panel:last-child{order:0}}
.below{margin-top:16px;max-width:1100px;margin-inline:auto}
.below.narrow{max-width:min(900px,calc((100vh - 90px) * 1.15))}
@media (max-width:900px){.below.narrow{max-width:100%}}
/* 수식 자판 */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#1f3f47;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.kp-row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(820px,100%)}
.kp-key{min-height:46px;border:0;border-radius:9px;background:#f4ead0;color:var(--sea-deep);font-size:20px;font-family:'Times New Roman',Georgia,serif;font-style:normal;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.kp-key.num{background:#fff}
.kp-key.fn{background:var(--brass);color:#fff;font-family:var(--display);font-size:16px}
.kp-key:active{transform:translateY(1px);filter:brightness(.92)}
body.kp-open .main{padding-bottom:280px}
.lbl.eq0{min-width:auto;font-family:'Times New Roman',Georgia,serif;font-size:22px}
@media (max-width:520px){.kp-key{min-height:40px;font-size:16px}.kp-key.fn{font-size:13px}}

.tess-types{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.toolbar .tool{width:auto;min-width:52px;height:52px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.toolbar .tool small{font-size:11px;color:var(--ink-soft)}
.tb-sep{width:1px;height:36px;background:#d9c99a;margin:0 4px}
.wsel{height:44px;border-radius:10px;font-size:16px;border:2px solid #d9c99a;background:#fff;padding:0 6px}
.tess-work{display:grid;grid-template-columns:minmax(0,640px) minmax(240px,1fr);gap:18px;align-items:start}
.tess-work>*{min-width:0}
.tess-canvas.erasing{cursor:cell}
.tess-form .field input{font-size:18px}
.tess-form textarea{min-height:150px}
@media (max-width:900px){.tess-work{grid-template-columns:1fr}}

/* 표지 */
.title-wrap{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(circle at 30% 20%,#3a6f74,#0a3640 70%)}
.title-card{position:relative;width:min(1030px,100%);border-radius:16px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(0,0,0,.7);border:4px solid #c48a1c;background:#efe4c6}
.title-img{display:block;width:100%;height:auto}
.title-fallback{padding:60px 24px 120px;font-size:40px;color:#1d2a2f}
.title-start{position:absolute;left:7%;bottom:9%;font-size:clamp(16px,2.4vw,26px);padding:.55em 1.3em;min-height:0;border-radius:999px;box-shadow:0 8px 18px -6px rgba(0,0,0,.55);animation:pulse 1.8s ease-in-out infinite}
.title-start[disabled]{opacity:.9;animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.title-start{animation:none}}
@media (max-width:520px){.title-start{position:static;display:block;width:calc(100% - 24px);margin:12px auto}}
.title-wrap,.login-wrap{min-height:100vh;min-height:100dvh}

/* 보물상자 열리는 장면 */
.cs-stage{position:relative;max-width:980px;margin:0 auto;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:3px solid var(--brass);background:radial-gradient(ellipse at 50% 70%,#3c2a12 0%,#1a1208 55%,#0b0804 100%);display:grid;place-items:center}
.cs-stage .skip{position:absolute;right:12px;top:12px;z-index:5}
.cs-chest{position:relative;width:42%;aspect-ratio:600/475;margin-top:12%;animation:cs-shake .9s ease-in-out 2 both}
.cs-chest img{position:absolute;inset:0;width:100%;height:100%}
.cs-base{clip-path:polygon(0 37.5%,23.3% 48%,55.8% 44.6%,71.7% 43.2%,100% 39.2%,100% 100%,0 100%)}
.cs-lid{clip-path:polygon(0 0,100% 0,100% 39.2%,71.7% 43.2%,55.8% 44.6%,23.3% 48%,0 37.5%);transform-origin:50% 8%;transition:transform 1s cubic-bezier(.2,1.4,.4,1);z-index:3}
.cs-light{position:absolute;left:12%;right:6%;top:30%;height:22%;border-radius:50%;background:radial-gradient(ellipse,#fff6c9 0%,#ffd54a 35%,rgba(255,170,0,0) 70%);opacity:0;transform:scale(.4);transition:opacity .6s .15s,transform 1s .15s;z-index:2}
.cs-glow{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;top:15%;background:radial-gradient(circle,rgba(255,220,120,.55),rgba(255,180,40,0) 65%);opacity:0;transform:scale(.3);transition:opacity .9s .2s,transform 1.4s .2s}
.cs-rays{position:absolute;width:140%;aspect-ratio:1;top:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.22) 0 8deg,rgba(255,215,90,0) 8deg 22deg);border-radius:50%;opacity:0;transition:opacity 1.2s .3s;animation:cs-spin 18s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 65%);mask:radial-gradient(circle,#000 25%,transparent 65%)}

.cs-stage.open .cs-chest{animation:none}

@keyframes cs-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) translateY(-2%)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg) translateY(-1%)}80%{transform:rotate(1.5deg)}}

    MISSIONS.forEach(m => { S.prog[m] = S.prog[m] || { solved: false, wrong: 0 }; if (S.prog.v[m] == null) S.prog.v[m] = Math.floor(Math.random() * 6); });

    root.appendChild(el('div', { class: 'app' }, [el('header', { class: 'topbar', id: 'topbar' }), el('main', { class: 'main', id: 'main' })]));
    if (en.readOnly) S.closed = true;
    go(ORDER.includes(S.prog.screen) ? S.prog.screen : 'map');
    if (en.readOnly) window.TM_onClosed(en.code);
    else if (!p) save(true);
  }

  /* 첫 화면 (표지) — 그림은 index.html 안에 들어 있어 바로 보임 */
  /* 저작권 표시 */
  function copyrightEl() {
    return el('footer', { class: 'copyright' }, [
      el('p', { class: 'cr1', text: '© 2026 경남고등학교 수학과 최선지 선생님 · 도형의 방정식 탐험 「보물을 찾아라」' }),
      el('p', { class: 'cr2', text: '원 저작자(경남고 수학과 최선지 선생님)를 표시하면 비영리 교육 목적으로 이용할 수 있어요(CC BY-NC 4.0).' }), el('p', { class: 'cr2', text: '저작자 표시 없는 무단 복제·배포와 상업적 이용은 금지합니다.' }), el('p', { class: 'cr2', text: '자료 이용을 원하시면 연락 주세요.' }),
      el('p', { class: 'cr3', text: 'Math Land Explorers · 수식 입력: MathLive (MIT License)' })]);
  }
  function titleScreen(ready) {
    const root = $('#root'); root.innerHTML = '';
    const btn = el('button', { class: 'btn brass title-start', type: 'button', text: '탐험 시작하기 ▶' });
    const msg = el('div', { class: 'title-msg', 'aria-live': 'polite' });
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = '보물지도를 펼치는 중…';
      const go = await ready;
      go();
    });
    const ts = document.getElementById('tm-title-src'), src = ts ? ts.getAttribute('src') : '';
    root.appendChild(el('div', { class: 'title-wrap' }, [
      el('div', { class: 'title-card' }, [
        src ? el('img', { class: 'title-img', src, alt: '경남이의 도형의 방정식을 이용한 보물찾기탐험' }) : el('h1', { class: 'title-fallback', text: '경남이의 도형의 방정식을 이용한 보물찾기탐험' }),
        el('span', { class: 'title-practice', text: '연습 버전' }),
        btn
      ]), msg, copyrightEl()
    ]));
  }
  async function boot() {
    window.TM_STAGE = 'title';
    const ml = (window.customElements && customElements.whenDefined) ? Promise.race([customElements.whenDefined('math-field').then(() => true), new Promise(r => setTimeout(() => r(false), 7000))]) : Promise.resolve(false);
    const ready = (async () => {
      window.TM_STAGE = 'images';
      try { await loadImages(); } catch (e) { window.TM_showErr && window.TM_showErr('그림 불러오기 실패: ' + (e && e.message || e)); }
      window.TM_STAGE = 'mathlive';
      MATHLIVE = await ml;
      if (MATHLIVE && window.MathfieldElement) { try { window.MathfieldElement.soundsDirectory = null; window.MathfieldElement.fontsDirectory = window.EMBED_IMAGES ? null : ['https:', '', 'cdn.jsdelivr.net', 'npm', 'mathlive@0.108.2', 'fonts', ''].join('/'); } catch (e) { } }
      return async () => { window.TM_STAGE = 'login'; const en = await API.start(); window.TM_STAGE = 'run'; start(en); };
    })();
    titleScreen(ready);
  }
  // 선생님이 마감하면(또는 기간이 끝나면): 더 이상 고칠 수 없다는 안내를 화면 전체에 띄움. 지금까지 기록은 볼 수 있음
  window.TM_onClosed = (code) => {
    if (document.querySelector('.closed-ov')) return;
    S.closed = true;
    try { KP.close(); } catch (e) { }
    const ev = !ACT.practice;
    const title = code === 'ended' ? '기간이 끝났어요' : ev ? '수행평가가 마감되었어요' : '활동이 마감되었어요';
    const body = (code === 'ended' ? '이 활동의 기간이 지났어요. ' : ev ? '선생님이 이 반의 수행평가를 마감했어요. ' : '선생님이 이 활동을 마감했어요. ')
      + '지금까지 저장된 기록은 선생님께 그대로 전달되고, 더 이상 고치거나 제출할 수 없어요.';
    const ov = el('div', { class: 'closed-ov', role: 'alertdialog', 'aria-label': title }, el('div', { class: 'closed-card' }, [
      el('div', { class: 'closed-ic', text: '🔒' }), el('h2', { text: title }), el('p', { text: body }),
      el('div', { class: 'row', style: 'justify-content:center' }, [
        el('button', { class: 'btn ghost', type: 'button', onclick: () => ov.remove(), text: '내 기록 보기' }),
        el('button', { class: 'btn brass', type: 'button', onclick: () => window.TM_logout(), text: '나가기' })])]));
    document.body.appendChild(ov);
  };
  window.TM_logout = () => { try { API.flush(); } catch (e) { } window.Land.logout(); };
  window.TM_state = S; window.TM_go = (k) => go(k);
  window.TM_STAGE = 'app-loaded';
  let started = false;
  const startOnce = () => { if (started) return; started = true; window.TM_STAGE = 'boot'; Promise.resolve().then(boot).catch(e => window.TM_showErr && window.TM_showErr('boot: ' + (e && e.message || e))); };
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', startOnce); window.addEventListener('load', startOnce); setTimeout(startOnce, 1500); } else startOnce();
})();

</script>
</body>
