<!doctype html>
<html lang="ko">
<head>

<title>무리수 사냥 · 새 주소로 이동</title>
<meta http-equiv="refresh" content="2; url=activities/jungle-run/">

<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;

         font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
  .card { background:#fffdf6; border-radius:24px; padding:28px; max-width:420px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.3); }

  p { line-height:1.6; margin:0 0 16px; }
  a.btn { display:inline-block; background:#3fa45b; color:#fff; text-decoration:none; font-weight:700; padding:14px 28px; border-radius:999px; font-size:18px; }

<body>
  <div class="card">
    <h1>🌴 무리수 사냥이 이사했어요</h1>

    <a class="btn" href="activities/jungle-run/">새 무리수 사냥으로 가기</a>

  <script>
    // 주소 뒤에 붙은 내용(?…#…)은 그대로 넘겨요
    setTimeout(function () { location.replace('activities/jungle-run/' + location.search + location.hash); }, 1500);
  </script>
</body>
